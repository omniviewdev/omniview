name: UI next kit probes

# Slice 1a, PRs 1a.4d and 1a.3c (docs/ui-next/slices/1a-pods-list.md, 3.2 and 4.1): the kit's parts on the real `ui-next` page, in WebKit and
# Chromium at 1440 x 900 and 1030 x 720, against a PINNED copy of the design mock's own values (packages/kit/probes/mock-reference.json for the
# parts and mock-table.json for the table, measured from the mock at tag spec-baseline-2026-11-16 by packages/kit/probes/generate-reference.mjs,
# which writes where each came from into the file; the design lab is private and is never needed here).
# Four probes, each fails the job on a difference: kit-probe (parity with the mock, tokens, counts, keyboard, accessibility with axe-core),
# table-probe (the table: header, rows, selection column, sort, hover, selected and focus states, the fit, the nine themes), fonts-probe (the
# fonts are delivered, used and the page does not shift) and tooltip-probe (the one tooltip host: listeners, cost, delay, Escape layering,
# placement, motion).
#
# NOT a required check yet, for the reason ui-next-pods.yml gives: it is path-filtered, and a required check that does not run on a pull
# request blocks the merge. The lead makes it required in the branch protection settings once it has been green for a while.

on:
  pull_request:
    paths:
      - "packages/kit/**"
      - "ui-next/**"
      - "packages/omniviewdev-runtime/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ui-next-kit-probes.yml"
  push:
    branches: [main]
    paths:
      - "packages/kit/**"
      - "ui-next/**"
      - "packages/omniviewdev-runtime/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ui-next-kit-probes.yml"
  workflow_dispatch:

concurrency:
  group: ui-next-kit-probes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  OMNIVIEW_UI: next

jobs:
  probes:
    name: Kit probes
    # Playwright 1.64 supports Ubuntu 24.04, not ubuntu-latest. The reference widths hold on Linux because the probes launch Chromium with
    # --font-render-hinting=none (probes/probe-lib.mjs): with the default hinting its text is rounded to whole pixels, unlike every other engine.
    runs-on: ubuntu-24.04
    # 30 minutes held 29 of them on the last run (the browsers' cold install alone took 20), so the detail probe's minutes needed room of their own. The log probe and its seven controls
    # (P1b-2) took 2 m 42 s and 1 m 45 s on a runner (run 44604456802: 28 minutes in all, the browsers cached); a cold install on top of that is about 48 minutes (an estimate), so 55 and not 40.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace packages (the kit among them)
        run: |
          task packages
          # `task packages` rewrites this tracked shim (docs/ui-next/AGENTS.md, Commands); it is not part of the change under test.
          git checkout -- packages/omniviewdev-vite-plugin/shims/_omniviewdev__runtime__models.mjs

      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.1-chromium-webkit

      - name: Install the browsers
        run: |
          # A hung browser download once held this step for 29 minutes: bound each attempt, retry once.
          for attempt in 1 2; do
            if timeout --kill-after=15 720 pnpm exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out after 720 s"
          done
          echo "::error::Playwright browser install failed twice"
          exit 1

      # The `runner` context does not exist in a workflow-level `env`, so the directory is exported from a step.
      - name: Build ui-next once, for every probe below
        run: |
          echo "PROBE_DIST=$RUNNER_TEMP/ui-next-dist" >> "$GITHUB_ENV"
          OMNIVIEW_BUILD_OUTPUT_DIRECTORY="$RUNNER_TEMP/ui-next-dist" pnpm exec vite build

      - name: Probe the parts against the pinned mock reference
        run: DIST="$PROBE_DIST" REPORT="$RUNNER_TEMP/kit-probe.json" node packages/kit/probes/kit-probe.mjs

      - name: Probe the table against the pinned mock reference
        run: DIST="$PROBE_DIST" REPORT="$RUNNER_TEMP/table-probe.json" node packages/kit/probes/table-probe.mjs

      - name: Probe the fonts and the layout shift
        run: DIST="$PROBE_DIST" REPORT="$RUNNER_TEMP/fonts-probe.json" node packages/kit/probes/fonts-probe.mjs

      - name: Probe the tooltip host
        run: DIST="$PROBE_DIST" REPORT="$RUNNER_TEMP/tooltip-probe.json" node packages/kit/probes/tooltip-probe.mjs

      # The shell's probes build their own fixtures (the repository's `vite build` of ui-next/shell/probes/*.html, once for production and once for React's development build, which the
      # commit counts read), so they do not read PROBE_DIST. The strip probe runs at 1440 x 900 and 1280 x 800 (decision A15); the frame probe at its reference's two viewports until the
      # probe viewports switch (tracker row N23). Linux Chromium needs the hinting flag the kit probes use, which the probes pass themselves.
      - name: Probe the shell frame against the pinned mock reference
        run: REPORT="$RUNNER_TEMP/shell-probe.json" node ui-next/shell/probes/shell-probe.mjs

      - name: Probe the tab strip, the page host and the load against the pinned mock reference
        run: REPORT="$RUNNER_TEMP/strip-probe.json" node ui-next/shell/probes/strip-probe.mjs

      # The rail (S2a): its entries' targets, faces and glyphs, and the paint of the current entry and of another in six states, against the pinned mock reference (ui-next/shell/probes/mock-rail.json,
      # measured from the mock's two rails by mock-rail-measure.mjs), at 1440 x 900 and 1280 x 800. It builds its own fixture, so it does not read PROBE_DIST.
      - name: Probe the rail against the pinned mock reference
        run: REPORT="$RUNNER_TEMP/rail-probe.json" node ui-next/shell/probes/rail-probe.mjs

      # The bottom panel (P1a): the region, the splitter, the tool strip, the session tabs, the session card and the status bar's toggle against the pinned mock reference
      # (ui-next/shell/probes/mock-panel.json, measured from the mock's own panel by mock-panel-measure.mjs), what opening and resizing the panel move (the frame's height, nothing else), the paint of its parts,
      # the keyboard path and the splitter's keys with real key presses, axe, what a drag costs (no write at the document root, no commit while the pointer moves), a plugin's tool that registers late, and a
      # session body that keeps running while it is hidden, at 1440 x 900 and 1280 x 800. It builds its own fixtures, so it does not read PROBE_DIST.
      - name: Probe the bottom panel against the pinned mock reference
        run: REPORT="$RUNNER_TEMP/panel-probe.json" node ui-next/shell/probes/panel-probe.mjs

      # The negative controls of that probe: each perturbs one measured value in the page (the region's height, the gap between a session's glyph and its name, the toggle's place, a tool tab's padding, the
      # sidebar's place when the panel opens, a write at the document root during a drag) and passes only when the probe sees it. A probe that cannot fail proves nothing.
      - name: Probe that the panel probe sees a panel that is wrong
        run: |
          for control in panel-height session-gap toggle tab-padding shift root-write; do
            NEGATIVE_CONTROL="$control" node ui-next/shell/probes/panel-probe.mjs
          done

      # The host's Logs tool (P1b-3a) on the host fixture (`?logs=1`): the log view fills the panel's body, opening a session moves nothing outside the log view, switching tool and back keeps the lines and the scroll place, what the
      # plugin counts of its feed (the registry and the view listen while the session is on screen, only the registry while another tool is shown, none once the tab is closed), and what the 10,000 lines a second session costs: at most one
      # commit a frame (and at least one) with the panel open (React's development build), and with the panel closed or another tool shown no commit, no frame requested, no timer started, no DOM mutation and (Chromium) no layout or
      # style recalculation, WHILE THE FEED WENT ON (the fixture counts the lines it made: none was read, each is held by the stream or dropped past its bound of 100,000), and back on the Logs tool the view shows newer lines than it
      # had when it was hidden, with every line the feed made since accounted for, at 1440 x 900 and 1280 x 800. It builds its own fixtures, so it does not read PROBE_DIST.
      - name: Probe the Logs tool in a real engine
        run: REPORT="$RUNNER_TEMP/logs-probe.json" node ui-next/shell/probes/logs-probe.mjs

      # The negative control of that probe: the feed goes quiet once the view is hidden, which a view that costs nothing because its feed is quiet would pass every zero of. The probe must fail its check that the feed went on
      # (Chromium at 1440 x 900, the hidden section only), and the step passes only when it did.
      - name: Probe that the logs probe sees a feed that stopped
        run: NEGATIVE_CONTROL=feed-stopped node ui-next/shell/probes/logs-probe.mjs

      # The log view (P1b-2): the kit's LogView staged at the size of the mock's Logs tool against the pinned mock reference (packages/kit/probes/mock-log.json, measured from the mock by
      # mock-log-measure.mjs): the regions, the header, the rows, the filter row in five states (nothing in it moves), the Tab stops and the list's keys with real key presses, the `copy` event
      # as plain text, and axe, in WebKit and Chromium at 1440 x 900 and 1280 x 800. What differs from the mock on purpose is listed in the probe (KNOWN_DEVIATIONS), each with its approval.
      - name: Probe the log view against the pinned mock reference
        run: DIST="$PROBE_DIST" REPORT="$RUNNER_TEMP/log-probe.json" node packages/kit/probes/log-probe.mjs

      # The negative controls of that probe: each perturbs one measured value in the page (a row's height, the clock column's width, the filter row's place when a count appears, the strip's
      # height, the copy event, the ArrowDown key, an unnamed button) and passes only when the probe's assertion for it is made and agrees without the perturbation and fails with it.
      - name: Probe that the log probe sees a log view that is wrong
        run: |
          for control in row-height time-column filter-shift strip-height copy keys axe; do
            DIST="$PROBE_DIST" NEGATIVE_CONTROL="$control" node packages/kit/probes/log-probe.mjs
          done

      # The detail page (D1a) in the real shell fixture: the header, the strip and the first sections against the pinned mock reference (packages/kit/probes/mock-detail.json), loading to ready
      # with no part moving, and the keyboard path through the strip, at 1440 x 900 and 1280 x 800. It builds its own fixture, so it does not read PROBE_DIST.
      - name: Probe the detail page against the pinned mock reference
        run: node ui-next/page/probes/detail-probe.mjs

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-probe-reports
          path: ${{ runner.temp }}/*-probe.json
          if-no-files-found: ignore
