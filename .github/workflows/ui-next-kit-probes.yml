name: UI next kit probes

# Slice 1a, PRs 1a.4d and 1a.3c (docs/ui-next/slices/1a-pods-list.md, 3.2 and 4.1): the kit's parts on the real `ui-next` page, in WebKit and Chromium at 1440 x 900 and 1030 x 720 (the shell's probes at 1440 x 900 and
# 1280 x 800; tracker row N23 moves the first to the second), against a PINNED copy of the design mock's own values (packages/kit/probes/mock-reference.json for the parts and mock-table.json for the table, measured
# from the mock at tag spec-baseline-2026-11-16 by packages/kit/probes/generate-reference.mjs, which writes where each came from into the file; the design lab is private and is never needed here).
# Each probe fails its job on a difference. They are listed in scripts/ci/probe-shards.mjs, each with what it checks, its negative controls and the shard that runs it.
#
# THE SHARDS (N24, step K1). The probes took 26 to 33 minutes one after the other in one job. They now run in five jobs at the same time, `Kit probes shard 1` to `5`, each one the probes (with their negative
# controls) that scripts/ci/probe-shards.mjs gives it, and the job named `Kit probes` waits for them and is green only when every one is. A probe is a Node process on its own VM, as it was on the one VM: nothing
# is shared between probes but the ui-next build in $PROBE_DIST, which each shard makes for itself when one of its probes reads it. To add a probe, add a unit to the table (the check below fails, naming the file,
# when a probe script is in no shard); to move one, move its unit.
#
# NOT a required check yet, for the reason ui-next-pods.yml gives: it is path-filtered, and a required check that does not run on a pull
# request blocks the merge. The lead makes `Kit probes` (the aggregating job, whose name does not change) required in the branch protection settings once it has been green for a while.

on:
  pull_request:
    paths:
      - "packages/kit/**"
      - "ui-next/**"
      - "packages/omniviewdev-runtime/**"
      - "pnpm-lock.yaml"
      - "scripts/ci/probe-shards.mjs"
      - "scripts/ci/probe-shards.test.mjs"
      - ".github/workflows/ui-next-kit-probes.yml"
  push:
    branches: [main]
    paths:
      - "packages/kit/**"
      - "ui-next/**"
      - "packages/omniviewdev-runtime/**"
      - "pnpm-lock.yaml"
      - "scripts/ci/probe-shards.mjs"
      - "scripts/ci/probe-shards.test.mjs"
      - ".github/workflows/ui-next-kit-probes.yml"
  workflow_dispatch:

concurrency:
  group: ui-next-kit-probes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  OMNIVIEW_UI: next

jobs:
  shard:
    name: Kit probes shard ${{ matrix.shard }}
    # Playwright 1.64 supports Ubuntu 24.04, not ubuntu-latest. The reference widths hold on Linux because the probes launch Chromium with
    # --font-render-hinting=none (probes/probe-lib.mjs): with the default hinting its text is rounded to whole pixels, unlike every other engine.
    runs-on: ubuntu-24.04
    # A shard takes about 9 minutes when the browsers install in one (setup 2, probes 4 to 7; the longest shard is the panel probe and its controls), so twice that is 18. It is 30 because the browser install below
    # is bounded by its own retry: a first attempt that hangs is killed after 15 minutes and the second one runs, and a limit under 25 would cut that second attempt off and turn a healed install into a red shard.
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end: a shard that fails does not stop the others, so one push shows every failing probe, and `Kit probes` below needs all of them.
      fail-fast: false
      matrix:
        # The shards of scripts/ci/probe-shards.mjs, one line: `check` fails when this list and the table differ, so a shard that is in one and not the other cannot go unnoticed.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before anything is built or downloaded: the check (every probe script of the probe directories is in exactly one shard, every shard is in the matrix above), then the tests of the check and of the job below, then what
      # this shard runs. The check comes first so that a probe that is in no shard fails here, in every shard, in a few seconds, with its path on the error line and nothing before it.
      - name: Check the shard table and plan this shard
        id: plan
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node scripts/ci/probe-shards.mjs check
          node --test scripts/ci/probe-shards.test.mjs
          node scripts/ci/probe-shards.mjs plan "$SHARD"

      - name: Build the workspace packages (the kit among them)
        run: |
          task packages
          # `task packages` rewrites this tracked shim (docs/ui-next/AGENTS.md, Commands); it is not part of the change under test.
          git checkout -- packages/omniviewdev-vite-plugin/shims/_omniviewdev__runtime__models.mjs

      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.1-chromium-webkit

      - name: Install the browsers
        run: |
          # A hung browser download once held this step for 29 minutes: bound each attempt, retry once.
          for attempt in 1 2; do
            if timeout --kill-after=15 900 pnpm exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out after 900 s"
            # The killed attempt can leave its root apt-get running: let the retry wait for the dpkg lock instead of failing on it.
            echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout >/dev/null
          done
          echo "::error::Playwright browser install failed twice"
          exit 1

      # The kit's probes (parts, table, fonts, tooltip, log view) read one production build of ui-next, made here once; the shell's probes build their own fixtures, so a shard that has none of the first skips this step.
      # The `runner` context does not exist in a workflow-level `env`, so the directory is exported from a step.
      - name: Build ui-next once, for the probes of this shard that read it
        if: steps.plan.outputs.dist == 'true'
        run: |
          echo "PROBE_DIST=$RUNNER_TEMP/ui-next-dist" >> "$GITHUB_ENV"
          OMNIVIEW_BUILD_OUTPUT_DIRECTORY="$RUNNER_TEMP/ui-next-dist" pnpm exec vite build

      # Every probe of the shard, with its negative controls, one after the other, as the single job ran them (scripts/ci/probe-shards.mjs: the same scripts, the same env, FONT_DELAY_MS=40 included). All of them run even
      # when one fails, so that a push shows every failing probe; the step fails when any did, names each in an error line with the last lines of its output, and writes the seconds of every probe to the job summary.
      - name: Run the probes of this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/probe-shards.mjs run "$SHARD"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-probe-reports-${{ matrix.shard }}
          path: ${{ runner.temp }}/*-probe.json
          if-no-files-found: ignore

  # The check that keeps the name `Kit probes`. Green only when every shard succeeded: a shard that failed, timed out (cancelled) or was skipped fails it, and so does an empty or unknown result; a cancelled run does not run it,
  # as before. The matrix's result is one word for all its shards, so the shards that did not succeed are named from the job list of this run (the token reads it with `actions: read`).
  probes:
    name: Kit probes
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require every probe shard to have succeeded
        env:
          RESULT: ${{ needs.shard.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RESULT" = success ]; then
            echo "Every probe shard succeeded."
            exit 0
          fi
          echo "::error title=Kit probes::the probe shards finished as '${RESULT:-unknown}', not as success: a shard that failed, was cancelled or was skipped fails this check"
          if listed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Kit probes shard ")) | select(.conclusion != "success") | "::error title=Kit probes::\(.name) finished as \(.conclusion // .status): \(.html_url)"' 2>&1); then
            if [ -n "$listed" ]; then printf '%s\n' "$listed"; fi
          else
            echo "::warning title=Kit probes::could not list the shards of this run: $listed"
          fi
          exit 1
