name: UI next kit probes

# The kit's parts and the shell's pages on the real `ui-next` page, in WebKit and Chromium, against a PINNED copy of the design mock's values (packages/kit/probes/mock-*.json). Each probe fails its job on a
# difference. They are listed in scripts/ci/probe-units (one file for each probe: its units, each with the seconds it takes on the runner and its negative controls) and in scripts/ci/probe-units.manifest.json.
#
# THE PLAN packs every unit into the fewest shards of at most 432 s (scripts/ci/probe-pack.mjs) and fails when it would plan no shard; each `Kit probes shard <n>` runs its units in the CI image (pinned by digest,
# .github/ci/image.lock) one after the other, sharing the builds of the fixtures (scripts/ci/probe-builds.mjs), and warns, never fails, for a unit that took more or less than its seconds by a quarter and 60 s. THE VERDICT, the job named
# `Kit probes`, runs whatever happened: it requires the plan and every shard to have succeeded and every unit and every control of the table to have run once and passed, in as many shards as the plan made.
#
# NOT ON PULL REQUESTS AND NOT ON PUSHES TO MAIN (N34, the owner's order of 2026-11-25: "remove the probes from running in CI. 42 minutes is insane."). Authors run the probes they touch locally before a push
# (`task local:probes`, docs/ui-next/AGENTS.md rule 39) and the merger reruns them on the merged tree; CI runs everything (both engines, every negative control) every night and on request, and `ci-main-red`
# opens its issue when the night is red. No other workflow needs a probe result.
on:
  # The nightly run: everything (N30).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A run is never cancelled by a newer one (a group keeps one running and one pending run).
concurrency:
  group: ui-next-kit-probes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OMNIVIEW_UI: next

jobs:
  # The plan: the table is checked (every probe script is in a unit, the manifest's probes and controls are still there, every unit has whole seconds under the limit) and every unit is packed into shards. It writes the
  # matrix the shard jobs read and the number of shards, which `Kit probes` compares with what the shards report. It fails when it would plan no shard.
  plan:
    name: Kit probes plan
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Check the table and pack the shards
        id: plan
        run: |
          node scripts/ci/probe-shards.mjs check
          node scripts/ci/probe-shards.mjs plan

  shard:
    name: Kit probes shard ${{ matrix.shard }}
    needs: plan
    # Playwright 1.64 supports Ubuntu 24.04, not ubuntu-latest. The reference widths hold on Linux because the probes launch Chromium with
    # --font-render-hinting=none (probes/probe-lib.mjs): with the default hinting its text is rounded to whole pixels, unlike every other engine.
    runs-on: ubuntu-24.04
    # A shard is planned at 432 s of units (scripts/ci/probe-shards.mjs, LIMIT_SECONDS) plus a setup of 88 s (median; 137 s the slowest seen). No unit and no shard fails on its seconds (they only pack the shards): 15 minutes is
    # the one wall, for a shard that hangs or whose units outgrew their seconds. The 30 it had was for the bounded browser install of #557 (a first attempt killed after 15 minutes, then a second), which the image made unnecessary.
    timeout-minutes: 15
    # The CI image (.github/ci/Dockerfile, built by ci-image.yml) holds Node, pnpm, Task, the Playwright browsers of the version pnpm-lock.yaml resolves and the system libraries of WebKit and Chromium: the job installs none of
    # them. It is pinned by DIGEST, the one in .github/ci/image.lock (scripts/ci/check-image.mjs fails when a workflow pins another and when the lock is behind the repository's inputs). The package is private: the job token
    # reads it (`packages: read`), and the image is pulled with the credentials block, as the other container jobs do. `--init` is theirs too.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/omniviewdev/omniview-ci@sha256:289353ab91800166914d98c79ab71fa06b2261e7963c72a695dca606e36dd784
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      # Every shard runs to the end: a shard that fails does not stop the others, so one push shows every failing probe, and `Kit probes` below needs all of them.
      fail-fast: false
      # The plan's matrix: `{ include: [{ shard, units, seconds, dist }] }`. The shards are numbered from 1, the longest first; `units` are the ids of scripts/ci/probe-units; `dist` says whether a unit reads the ui-next build.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The runner creates this mount as UID 1001; Git must see the same owner as the container user after checkout's temporary HOME goes away.
      - name: Match checkout directory ownership to container user
        run: chown "$(id -u):$(id -g)" "$PWD"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Is the image the one this checkout needs? The lock's inputs (Dockerfile, Node, pnpm, Playwright, Go floor) against the repository's, and the manifest of the image that is running against both. A stale image fails
      # here, in a second, naming the input that moved, and not as a probe that cannot find its browser.
      - name: The image is not stale
        run: node scripts/ci/check-image.mjs check --manifest /opt/ci/manifest.json

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before anything is built: the check (every probe script of the probe directories is run by a unit, the manifest's probes and controls are still there, every unit has whole seconds under the limit), then the tests of the
      # check, the packing and this workflow. The check comes first so that a probe that is in no unit fails here, in every shard, in a few seconds, with its path on the error line and nothing before it.
      - name: Check the units and the tests of the engine
        run: |
          node scripts/ci/probe-shards.mjs check
          node --test scripts/ci/probe-*.test.mjs

      - name: Build the workspace packages (the kit among them)
        run: |
          task packages
          # `task packages` rewrites this tracked shim (docs/ui-next/AGENTS.md, Commands); it is not part of the change under test.
          git checkout -- packages/omniviewdev-vite-plugin/shims/_omniviewdev__runtime__models.mjs

      # The kit's probes (parts, table, fonts, tooltip, log view) read one production build of ui-next, made here once; the shell's probes build their own fixtures, so a shard that has none of the first skips this step
      # (the plan says so: `dist`). The `runner` context does not exist in a workflow-level `env`, so the directory is exported from a step.
      - name: Build ui-next once, for the units of this shard that read it
        if: matrix.dist == true
        run: |
          echo "PROBE_DIST=$RUNNER_TEMP/ui-next-dist" >> "$GITHUB_ENV"
          OMNIVIEW_BUILD_OUTPUT_DIRECTORY="$RUNNER_TEMP/ui-next-dist" pnpm exec vite build

      # Every unit of the shard, one after the other, as the single job ran them (scripts/ci/probe-shards.mjs: the same scripts, the same env, FONT_DELAY_MS=40 included). All of them run even when one fails, so that a push
      # shows every failing probe; the step fails when any did, names each in an error line with the last lines of its output, writes the seconds of every probe to the job summary, warns (never fails) when a unit took more or
      # less than its `seconds` by the larger of a quarter of them and 60 s, naming the number to put there, and writes ran-<shard>-probe.json, which `Kit probes` compares with the table. The matrix reaches the command
      # through env, never through the text of the command.
      - name: Run the units of this shard
        env:
          SHARD: ${{ matrix.shard }}
          UNITS: ${{ matrix.units }}
        run: node scripts/ci/probe-shards.mjs run "$SHARD" "$UNITS"

      # The probes' reports and what the shard says it ran (`ran-<shard>-probe.json`): `Kit probes` downloads them all.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-probe-reports-${{ matrix.shard }}
          # A re-run of a shard (or of the run) uploads the same name again: replace what the earlier attempt left, or the upload fails and the verdict reads a stale file.
          overwrite: true
          path: ${{ runner.temp }}/*-probe.json
          if-no-files-found: ignore

  # The check that keeps the name `Kit probes`. It runs whatever happened (`always()`: a cancelled run leaves a check, not an absence), with the repository checked out. First it requires the plan and every shard to have succeeded:
  # a plan that failed (no shard could run: the shards are skipped), a shard that failed, timed out (cancelled) or was skipped fails it, and so does an empty or unknown result; the matrix's result is one word for all its shards,
  # so the shards that did not succeed are named from the job list of this run (the token reads it with `actions: read`). Then, whatever the shards' own results said, it requires every unit of the table of this checkout and every
  # control of it to have run once and passed, from what the shards wrote: a plan that was short, a shard that never reported and a unit that dropped out of the matrix are red.
  probes:
    name: Kit probes
    needs: [plan, shard]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      # The verdict needs the table and the engine, nothing else: a sparse checkout of scripts/ci (a few files, a second), on the smallest runner, and nothing is built.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .tool-versions

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Require the plan and every probe shard to have succeeded
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PLAN_RESULT" = success ] && [ "$SHARD_RESULT" = success ]; then
            echo "The plan and every probe shard succeeded."
            exit 0
          fi
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error title=Kit probes::the plan job finished as '${PLAN_RESULT:-unknown}', not as success: no shard could run (the table failed its check, or the plan could not be written): see the job 'Kit probes plan'"
            exit 1
          fi
          echo "::error title=Kit probes::the probe shards finished as '${SHARD_RESULT:-unknown}', not as success: a shard that failed, was cancelled or was skipped fails this check"
          if listed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Kit probes shard ")) | select(.conclusion != "success") | "::error title=Kit probes::\(.name) finished as \(.conclusion // .status): \(.html_url)"' 2>&1); then
            if [ -n "$listed" ]; then printf '%s\n' "$listed"; fi
          else
            echo "::warning title=Kit probes::could not list the shards of this run: $listed"
          fi
          exit 1

      - name: Require every unit of the table to have run and passed
        env:
          PLAN_SHARDS: ${{ needs.plan.outputs.shards }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'kit-probe-reports-*' --dir "$RUNNER_TEMP/reports"
          node scripts/ci/probe-shards.mjs verify --reports "$RUNNER_TEMP/reports" --shards "$PLAN_SHARDS"
