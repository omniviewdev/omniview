name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *" # 6 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write
  packages: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.27"
  NODE_VERSION: "26.13.0"
  # Nightly is an optimized production profile, not a development tooling build.
  GOWORK: "off"
  GOFLAGS: ""
  GO_MODFILE: ""
  # Publish a compatible plugin-sdk and update go.mod before releasing; no local fallback.
  SDK_SOURCE: ""
  WAILS_MCP: ""
  EXTRA_TAGS: ""
  RELEASE: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Skip if no commits in the last 24 hours (unless manual dispatch)
  # ─────────────────────────────────────────────────────────────────────────────
  check-changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      nightly_version: ${{ steps.check.outputs.nightly_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent commits
        id: check
        shell: bash
        run: |
          NIGHTLY_VERSION="0.0.0-nightly.$(date -u +%Y%m%d).${{ github.run_number }}.${{ github.run_attempt }}"
          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF=$((NOW - LAST_COMMIT))

          if [ "$DIFF" -lt 86400 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 24 hours — skipping nightly build"
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      version: ${{ needs.check-changes.outputs.nightly_version }}
      channel: nightly
      development: ${{ 'true' }}
      state-dir: ~/.omniview-nightly
      inject-registry-key: false
      artifact-prefix: nightly-

  check-homebrew:
    needs: build
    uses: ./.github/workflows/homebrew-check.yml
    with:
      artifact: nightly-macos-dmg
      cask: omniview-nightly


  publish-updates:
    runs-on: [omniview]
    needs: [check-changes, build, check-homebrew]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.check-changes.outputs.should_build == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nightly-macos-dmg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nightly-macos-update-zip
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nightly-linux-binary
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nightly-windows-binary
          path: dist
      - name: Publish signed update
        shell: bash
        env:
          UPDATER_SIGNING_KEYS: ${{ secrets.UPDATER_SIGNING_KEYS }}
          UPDATE_SERVICE_PUBLISH_TOKEN: ${{ secrets.UPDATE_SERVICE_PUBLISH_TOKEN }}
          UPDATE_SERVICE_URL: http://omniview-update-service-api.omniview.svc.cluster.local:5000
        run: |
          node build/updater/publish-to-update-service.mjs --channel nightly \
            --version "${{ needs.check-changes.outputs.nightly_version }}" --dir dist \
            --git-sha "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # ─────────────────────────────────────────────────────────────────────────────
  # NPM — publish @omniviewdev/* nightly packages
  # ─────────────────────────────────────────────────────────────────────────────
  publish-npm:
    needs: [check-changes, build, check-homebrew]
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ needs.check-changes.outputs.nightly_version }}
      dist-tag: nightly

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish nightly — rolling tag
  # ─────────────────────────────────────────────────────────────────────────────
  publish-nightly:
    runs-on: ubuntu-latest
    needs: [check-changes, build, check-homebrew, publish-npm]
    steps:
      - name: Verify Homebrew publication credentials
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ': "${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is required to publish the CLI-enabled cask}"'

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/nightly-macos-dmg/*.dmg release/
          cp artifacts/nightly-linux-binary/* release/
          cp artifacts/nightly-windows-binary/*.exe release/

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum * > checksums_sha256.txt

      - name: Delete previous nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (${{ needs.check-changes.outputs.nightly_version }})"
          body: |
            Automated nightly build from `main` branch.

            **Version**: `${{ needs.check-changes.outputs.nightly_version }}`
            **Commit**: ${{ github.sha }}

            > These builds are for testing purposes and may be unstable.
            >
            > Install via Homebrew: `brew install --cask omniviewdev/tap/omniview-nightly`
          files: release/*
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Nightly Cask
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.check-changes.outputs.nightly_version }}"
          DMG_FILE="release/Omniview_${VERSION}_darwin_universal.dmg"
          SHA256=$(sha256sum "$DMG_FILE")
          SHA256=${SHA256%% *}

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/omniviewdev/homebrew-tap.git" tap
          node build/homebrew/update-cask.mjs tap/Casks/omniview-nightly.rb "$VERSION" "$SHA256"
          cd tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/omniview-nightly.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update omniview-nightly to ${VERSION}"
          git push
