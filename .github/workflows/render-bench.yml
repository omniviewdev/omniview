name: Render Benchmarks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"

jobs:
  render-bench:
    name: Render benchmarks
    # Keep browser benchmarks on the same Ubuntu 24.04 baseline as native CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest Kubernetes release
        id: kubernetes-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/omniviewdev/omniview-plugin-kubernetes/releases/latest --jq '.tag_name')"
          test -n "$tag" && test "$tag" != "null"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Kubernetes source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview-plugin-kubernetes
          ref: ${{ steps.kubernetes-release.outputs.tag }}
          path: .render-bench-sources/kubernetes
          persist-credentials: false

      - name: Record Kubernetes commit
        id: kubernetes
        run: echo "commit=$(git -C .render-bench-sources/kubernetes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Kubernetes UI dependencies
        working-directory: .render-bench-sources/kubernetes/ui
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: task packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run render benchmarks
        env:
          KUBERNETES_SOURCE: ${{ github.workspace }}/.render-bench-sources/kubernetes
        run: pnpm bench:render

      - name: Save Kubernetes provenance
        if: always() && steps.kubernetes.outcome == 'success'
        env:
          KUBERNETES_COMMIT: ${{ steps.kubernetes.outputs.commit }}
        run: |
          mkdir -p bench/render/results
          printf '%s\n' "$KUBERNETES_COMMIT" > bench/render/results/kubernetes-commit.txt

      - name: Job summary
        if: always()
        run: |
          if [ -f bench/render/results/latest.json ]; then
            node bench/render/report.mjs --title "Render benchmarks (${{ github.sha }}, ubuntu-24.04)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-bench-results
          path: bench/render/results/
          if-no-files-found: ignore
          retention-days: 30
