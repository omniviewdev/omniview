# Render benchmarks: Vitest browser mode (Chromium) over the host's `ui/` and the Kubernetes plugin's UI source, with the Wails backend replaced by fixtures
# (`pnpm bench:render`, vitest.render.config.ts). It asserts time bounds, so it is a performance gate, not a build check.
#
# THE PATH FILTER. The job runs only when a pull request changes something it reads: `ui/` (the app and the code the benches mount), `bench/render/` and
# `bench/vite/` (the benches, the fixtures, the Wails binding index), the three workspace packages the benches import or `task packages` builds before them
# (`omniviewdev-runtime`, with the committed Wails bindings, `omniviewdev-providers`, `omniviewdev-vite-plugin`), the Vite and Vitest configs, the root manifest, the
# lockfile and the pnpm workspace and patches (`pnpm install`), the TypeScript configs (esbuild reads `jsx` from them), `Taskfile.yml` (`task packages`) and this file.
# Not listed, on purpose: `packages/kit/` and `ui-next/` (no bench imports them, and `ui/` must not: AGENTS.md rule 10; the kit's build is run by UI checks and Kit probes), Go (the backend is a fixture), docs.
# A workflow-level `paths:` filter means a skipped run reports NO check
# at all; nothing requires this check (there is no branch protection on `main`, and the ruleset "Lockdown Main" has no required status checks), so a skip blocks no merge.
# Add a path here whenever a new input of the bench is introduced. `workflow_dispatch` is unaffected.
#
# THE PIN. KUBERNETES_PLUGIN_REF is a commit of the plugin's `main` branch: 524d1232a499cf868eb028af61912499736a37a5 (2026-11-14), the head of `main` when it was pinned and the commit the last
# unpinned run recorded, so pinning changes nothing about what is measured. Before, the checkout followed the default branch, so a plugin merge could change the benchmark of an unrelated pull request.
# To bump it, in a pull request of this repository that changes nothing else:
#   1. take the commit: `git ls-remote https://github.com/omniviewdev/omniview-plugin-kubernetes refs/heads/main`;
#   2. put it in KUBERNETES_PLUGIN_REF; the step "Record Kubernetes commit" fails if the checkout is anything else;
#   3. the job is green (it asserts time bounds, so run it twice before trusting a bump).

name: Render Benchmarks

on:
  pull_request:
    # `labeled`: the label `ci:bench` on a pull request starts it (a pull request runs this only when it carries that label, N30: 171 s of a runner on 9 of 20 pull requests for a gate that main and the nightly run hold).
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "ui/**"
      - "bench/render/**"
      - "bench/vite/**"
      - "packages/omniviewdev-runtime/**"
      - "packages/omniviewdev-providers/**"
      - "packages/omniviewdev-vite-plugin/**"
      - "vite.config.ts"
      - "vitest.render.config.ts"
      - "vitest.cache.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "tsconfig*.json"
      - "Taskfile.yml"
      - ".github/workflows/render-bench.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "bench/render/**"
      - "bench/vite/**"
      - ".github/workflows/render-bench.yml"
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: render-bench-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes the run of the one before it; a run on main is not cancelled by a newer push (N30; a group still keeps only one pending run).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26.13.0"
  KUBERNETES_PLUGIN_REF: 524d1232a499cf868eb028af61912499736a37a5

jobs:
  render-bench:
    name: Render benchmarks
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:bench') }}
    # Keep browser benchmarks on the same Ubuntu 24.04 baseline as native CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout matching Kubernetes source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview-plugin-kubernetes
          path: .render-bench-sources/kubernetes
          ref: ${{ env.KUBERNETES_PLUGIN_REF }}
          persist-credentials: false

      - name: Record Kubernetes commit
        id: kubernetes
        run: |
          commit="$(git -C .render-bench-sources/kubernetes rev-parse HEAD)"
          test "$commit" = "$KUBERNETES_PLUGIN_REF"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Kubernetes UI dependencies
        working-directory: .render-bench-sources/kubernetes/ui
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: task packages

      - name: Install Playwright Chromium
        run: |
          # A hung browser download once held this step for 29 minutes: bound each attempt, retry once.
          for attempt in 1 2; do
            if timeout --kill-after=15 480 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out after 480 s"
            # The killed attempt can leave its root apt-get running: let the retry wait for the dpkg lock instead of failing on it.
            echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout >/dev/null
          done
          echo "::error::Playwright browser install failed twice"
          exit 1

      - name: Run render benchmarks
        env:
          KUBERNETES_SOURCE: ${{ github.workspace }}/.render-bench-sources/kubernetes
        run: pnpm bench:render

      - name: Save Kubernetes provenance
        if: always() && steps.kubernetes.outcome == 'success'
        env:
          KUBERNETES_COMMIT: ${{ steps.kubernetes.outputs.commit }}
        run: |
          mkdir -p bench/render/results
          printf '%s\n' "$KUBERNETES_COMMIT" > bench/render/results/kubernetes-commit.txt

      - name: Job summary
        if: always()
        run: |
          if [ -f bench/render/results/latest.json ]; then
            node bench/render/report.mjs --title "Render benchmarks (${{ github.sha }}, ubuntu-24.04)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-bench-results
          path: bench/render/results/
          if-no-files-found: ignore
          retention-days: 30
