name: UI next Pods cluster check

# The seam, end to end (docs/ui-next/slices/n19-plugin-seam.md, N19d): the new shell, served by the real Go host built with OMNIVIEW_UI=next and opened the way the native
# window opens it (no URL parameter, no hash), must show the same Pods as `kubectl get pods -A` on a real kind cluster that holds the plan's fixture. The host holds no
# Pods code: the list is the Kubernetes plugin's own, from the bundle of its `feature/ui-next` branch (decision A16: on that branch the plugin's `ui/` is the new UI),
# built here from a PINNED commit with the plugin's own packaging script and installed as its archive lays it out (plugin.yaml, bin/plugin, assets/).
# The job also runs four negative controls, each of which must make the same check fail, so a check that has gone blind turns this job red:
#   a cluster without the fixture, a host without the plugin, the plugin installed without its bundle (`assets/` empty), and a cluster without the API group that cannot answer (INV4, next).
#
# INV4 (the demo's finding O2, plugin #281). One aggregated API that cannot answer (a metrics-server that is down is the usual one) used to keep the first Pods page of a fresh connection from loading ("Connection admission requires
# complete discovered support."; a press on Retry made it load). After the main check the job registers an APIService whose Service has no endpoints (scripts/ui-next-pods/unavailable-group.yaml), starts one more host AFTER that, so that
# the plugin connects to a cluster that already has the group, and reads that host's first Pods page, never pressing Retry: the page must list the Pods as kubectl does, the host must refuse no request of it, and the host's facts for
# the connection must name the group (`unavailable-group` mode of pods-cluster.check.mjs, unavailable.mjs). Against the plugin before #281 (ec5a06ea) that check fails on the first load.
#
# THE PIN. KUBERNETES_PLUGIN_REF is a commit of the plugin's `feature/ui-next` branch: c6d4665196d4ae983b09a01d160d5b5891be542c (#287, HM3-k8s: the cluster Overview is the page a connection lands on, vendored from host main 773be338 (the `overview` page kind #724 and `useConnectionMetadata` #723), 2026-11-25; before it #285, SDK4-k8s: the plugin's SDK is v0.22.1, the release this host pins and its floor admits, the exec lane keeps a command's last output for a late attach, 2026-11-23; before it #284, SDK3-k8s: the plugin's SDK was v0.22.0 and a Pod's logs declare the count of the lines at the head of each source's stream, the replay, which the host asks for and the Logs strip reads, 2026-11-22; before it #281, INV4: one unavailable API group no longer refuses the connection; #283, a cancelled restart reports its context's error; and #282, K3a: every kind's list sorts, 2026-11-21; before them #280, C1h: the Connection scope face carries role: 'connection'; and #279, K2c-2), the branch head
# with 29 kinds: the Pods list and the Pod page (D1b #263, D1c #264), the lists of Workloads (K2a #265), of K2b-1 (#266) and of K2b-2 (#269), the Secrets projection (SEC1 #268), the Logs command (#267), the counts the plugin's
# backend says (Q1 #270), the counts its sidebar draws (Q2 #273), the glyphs of its kinds (Q2b #274), the derived connection IDs (H6 #272), the plugin's Go CI (#277), the short names (#275), the generic detail page of nine kinds (K2c-1 #278) and the title of a deleted object's page (K2c-2 #279). The check opens the Pod page from the list, and a Deployment's page from the Deployments list (K2c-2: its Details rows against kubectl),
# and a Pod's Logs from its page, holds the sidebar's counts to kubectl's, and holds the scope lane's Connection text to the context's NAME: the ID is derived from the path of the check's temporary kubeconfig, so it differs on every run
# and the check reads it from the host's list of connections (lane.mjs). To bump it, in a pull request of this repository that changes nothing else about the check (the bump to #281 changed it by the one check named above, which fails against the pin before):
#   1. take the commit: `git ls-remote https://github.com/omniviewdev/omniview-plugin-kubernetes refs/heads/feature/ui-next`, or the merge commit of the plugin pull request you want;
#   2. put it in KUBERNETES_PLUGIN_REF, check the plugin out at it and run `node scripts/ui-next-pods/pin.mjs <that checkout>`: it fails when the plugin's list of shared
#      names (`ui/vendor/shared-specifiers.json`) is not this host's `SHARED_SPECIFIERS_V1`, or when the host commit the plugin vendored from (`ui/vendor/HOST_COMMIT`) is not
#      in this host's history. The step "Check the pin" runs the same script, and one more that the commit is on the branch;
#   3. the job is green: the pinned plugin renders the Pods of the cluster as kubectl lists them, and each control turns the job red.
# A plugin commit that was vendored from a newer host (the plugin's `hack/vendor-host.sh`) needs this host to contain that commit first.
#
# NOT ON PULL REQUESTS AND NOT ON PUSHES TO MAIN (N34, the owner's order of 2026-11-25): it runs every night and on request, and `ci-main-red` opens its issue when a night is red. Authors run it locally before a push when their change touches it (docs/ui-next/AGENTS.md, rule 25).
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

concurrency:
  group: ui-next-pods-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  GO_VERSION: "1.27.3"
  GOWORK: "off"
  GOFLAGS: ""
  GOTOOLCHAIN: local
  # One-node cluster, pinned: kind v0.30.0 (its Linux amd64 binary is verified by sha256 below) and the node image by digest (tag v1.35.0).
  KIND_VERSION: v0.30.0
  KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
  KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:4613778f3cfcd10e615029370f5786704559103cf27bef934597ba562b269661
  KUBECTL_VERSION: v1.35.0
  KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
  # The Kubernetes plugin: its `feature/ui-next` branch at the pin described above. Bump it deliberately.
  KUBERNETES_PLUGIN_REPOSITORY: omniviewdev/omniview-plugin-kubernetes
  KUBERNETES_PLUGIN_BRANCH: feature/ui-next
  KUBERNETES_PLUGIN_REF: c6d4665196d4ae983b09a01d160d5b5891be542c
  # The host in the mode the skeleton used: browser server mode, channel feature-ui-next, a private HOME per host (scripts/ui-next-pods/host.sh).
  # OMNIVIEW_UI=next is set on the step that builds the host only: the plugin has no flavour switch (decision A16) and its build must not see one.
  OMNIVIEW_E2E_WORK: ${{ github.workspace }}/.ui-next-pods
  KUBECONFIG_PATH: ${{ github.workspace }}/.ui-next-pods/kubeconfig

jobs:
  pods-cluster:
    name: Pods cluster check
    # Playwright 1.64 supports Ubuntu 24.04, not ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The whole history: "Check the pin" asks whether the host commit the plugin vendored from is one of this checkout's ancestors.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the Kubernetes plugin at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KUBERNETES_PLUGIN_REPOSITORY }}
          ref: ${{ env.KUBERNETES_PLUGIN_REF }}
          path: omniview-plugin-kubernetes
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            omniview-plugin-kubernetes/go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What the page may differ from kubectl by (scripts/ui-next-pods/agreement.mjs): a Pod kubectl changed between its two reads may read either way, nothing else may.
      # The contracts that need no cluster: the oracle and the agreement, the host script (it proves the plugin directory is installed whole, assets/ included), the pin, and what each page must say against
      # kubectl (the Pod detail, the Overview, the sidebar's counts, a Pod's Logs session, the scope lane, the unavailable API group), each with its negative controls.
      - name: Contracts that need no cluster
        run: node --test scripts/ui-next-pods/*.test.mjs

      # Before anything is built: the pin is a commit of the plugin's branch, its list of shared names is this host's, and the host it was vendored from is in this history.
      - name: Check the pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$KUBERNETES_PLUGIN_REPOSITORY/compare/$KUBERNETES_PLUGIN_REF...$KUBERNETES_PLUGIN_BRANCH" --jq .status)"
          case "$status" in
            identical|ahead) echo "$KUBERNETES_PLUGIN_REF is a commit of $KUBERNETES_PLUGIN_BRANCH ($status)" ;;
            *) echo "::error::$KUBERNETES_PLUGIN_REF is not a commit of $KUBERNETES_PLUGIN_REPOSITORY $KUBERNETES_PLUGIN_BRANCH (compare says: $status)"; exit 1 ;;
          esac
          node scripts/ui-next-pods/pin.mjs omniview-plugin-kubernetes HEAD

      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$OMNIVIEW_E2E_WORK"
          curl -fsSL -o "$RUNNER_TEMP/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum --check --strict
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/bin/kubectl" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create the kind cluster
        # The one retried step (R-11): a node image pull or a node start can fail for reasons outside this repository.
        run: |
          set -euo pipefail
          unset KUBECONFIG
          for attempt in 1 2 3; do
            if kind create cluster --name ui-next-pods --kubeconfig "$KUBECONFIG_PATH" --image "$KIND_NODE_IMAGE" --wait 180s; then
              exit 0
            fi
            echo "::warning::kind create cluster failed (attempt $attempt)"
            kind delete cluster --name ui-next-pods --kubeconfig "$KUBECONFIG_PATH" || true
            sleep 10
          done
          echo "::error::the kind cluster did not start in three attempts"
          exit 1

      - name: Build the workspace packages
        run: |
          task packages
          # `task packages` rewrites this tracked shim (docs/ui-next/AGENTS.md, Commands); it is not part of the change under test.
          git checkout -- packages/omniviewdev-vite-plugin/shims/_omniviewdev__runtime__models.mjs

      # `task build:server` also regenerates the Wails bindings, which needs GTK 4 and WebKitGTK to compile on Linux; the bindings are tracked
      # and checked by "Bindings freshness", so this step runs its other two stages: the frontend build and the server binary. The server
      # binary is built without cgo: the plain runner has no GTK or WebKitGTK, and server mode serves a browser, not a native window.
      - name: Build the host (OMNIVIEW_UI=next, server mode)
        env:
          OMNIVIEW_UI: next
        run: |
          set -euo pipefail
          PRODUCTION=true pnpm run build
          HOST_MODFILE="$(task --silent host:prepare)"
          CGO_ENABLED=0 go build -tags production,server -trimpath -buildvcs=false -ldflags="-w -s" -modfile="$HOST_MODFILE" -o bin/Omniview-server .

      # The plugin's own packaging: its UI (`pnpm install --frozen-lockfile && pnpm run build` in ui/, which writes ui/dist/assets/entry.js and fails on any import the host does
      # not share) and its binary, one archive with plugin.yaml, bin/plugin and assets/ at its root, the layout the app installs. Extracted, that is the directory host.sh installs.
      - name: Build the Kubernetes plugin from the pin
        working-directory: omniview-plugin-kubernetes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KUBERNETES_PLUGIN_REF"
          version="$(sed -n 's/^version: //p' plugin.yaml | head -n 1)"
          hack/package.sh "$version" linux_amd64
          mkdir -p "$OMNIVIEW_E2E_WORK/plugin"
          tar -xzf dist/kubernetes-linux_amd64.tar.gz -C "$OMNIVIEW_E2E_WORK/plugin"
          test -x "$OMNIVIEW_E2E_WORK/plugin/bin/plugin"
          test -s "$OMNIVIEW_E2E_WORK/plugin/assets/entry.js"
          # The control's plugin: the same archive with an empty assets/, so the host has the plugin's binary and no interface to load.
          cp -R "$OMNIVIEW_E2E_WORK/plugin" "$OMNIVIEW_E2E_WORK/plugin-no-bundle"
          rm -rf "$OMNIVIEW_E2E_WORK/plugin-no-bundle/assets"
          mkdir "$OMNIVIEW_E2E_WORK/plugin-no-bundle/assets"
          ls -l "$OMNIVIEW_E2E_WORK/plugin" "$OMNIVIEW_E2E_WORK/plugin/assets"

      - name: Install the browser
        run: |
          # A hung browser download once held this step for 29 minutes: bound each attempt, retry once.
          for attempt in 1 2; do
            if timeout --kill-after=15 480 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out after 480 s"
            # The killed attempt can leave its root apt-get running: let the retry wait for the dpkg lock instead of failing on it.
            echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout >/dev/null
          done
          echo "::error::Playwright browser install failed twice"
          exit 1

      - name: Start the host with the plugin
        run: scripts/ui-next-pods/host.sh start with-plugin 34201 "$KUBECONFIG_PATH" "$OMNIVIEW_E2E_WORK/plugin"

      # The cluster holds only kind's own Pods here: the check must report that the fixture is missing, not pass on kube-system.
      - name: Negative control, cluster without the fixture
        env:
          OMNIVIEW_CHECK_BASE_URL: http://127.0.0.1:34201
          OMNIVIEW_CHECK_KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          OMNIVIEW_CHECK_MODE: control-fixture-absent
        run: node --test scripts/ui-next-pods/pods-cluster.check.mjs

      - name: Apply the fixture
        run: |
          set -euo pipefail
          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl apply -f docs/ui-next/slices/1a-pods-list/fixture.yaml
          kubectl -n checkout rollout status deploy/cart-api deploy/payment-gateway --timeout=240s
          kubectl -n checkout rollout status sts/cart-cache --timeout=240s
          kubectl -n monitoring rollout status ds/node-agent deploy/alertmanager --timeout=240s
          kubectl -n batch wait --for=condition=complete job/nightly-report --timeout=240s
          kubectl get pods -A

      - name: Start the host without the plugin
        run: scripts/ui-next-pods/host.sh start without-plugin 34202 "$KUBECONFIG_PATH" none

      # Same check, same cluster, same fixture; the plugin is the only difference. The window has no plugin to open: it must stop at the host's own empty list of plugins.
      - name: Negative control, host without the Kubernetes plugin
        env:
          OMNIVIEW_CHECK_BASE_URL: http://127.0.0.1:34202
          OMNIVIEW_CHECK_KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          OMNIVIEW_CHECK_MODE: control-plugin-absent
        run: node --test scripts/ui-next-pods/pods-cluster.check.mjs

      - name: Start the host with the plugin installed without its bundle
        run: scripts/ui-next-pods/host.sh start without-bundle 34203 "$KUBECONFIG_PATH" "$OMNIVIEW_E2E_WORK/plugin-no-bundle"

      # Same check, same cluster, same fixture, the plugin's binary installed: only assets/entry.js is missing. The Pods list is the plugin's bundle, so the page must stop at the plugin.
      - name: Negative control, the plugin without its bundle
        env:
          OMNIVIEW_CHECK_BASE_URL: http://127.0.0.1:34203
          OMNIVIEW_CHECK_KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          OMNIVIEW_CHECK_MODE: control-bundle-absent
        run: node --test scripts/ui-next-pods/pods-cluster.check.mjs

      - name: Check that the page and kubectl agree
        env:
          OMNIVIEW_CHECK_BASE_URL: http://127.0.0.1:34201
          OMNIVIEW_CHECK_KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: node --test scripts/ui-next-pods/pods-cluster.check.mjs

      # INV4. The same check, on the cluster the main check ran on, which holds no API group that cannot answer: it must stop at the group (GROUP_MISSING) before it opens a page.
      - name: Negative control, a cluster without the unavailable API group
        env:
          OMNIVIEW_CHECK_BASE_URL: http://127.0.0.1:34201
          OMNIVIEW_CHECK_KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          OMNIVIEW_CHECK_MODE: control-group-absent
        run: node --test scripts/ui-next-pods/pods-cluster.check.mjs

      # An aggregated API whose Service has no endpoints, the state of a metrics-server that is down, registered BEFORE the host that connects starts. The aggregator marks it Available=False (MissingEndpoints) at once;
      # the wait is the proof that it did, and the check reads the same fact from the cluster before it opens a page.
      - name: Register an API group that cannot answer
        run: |
          set -euo pipefail
          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl apply -f scripts/ui-next-pods/unavailable-group.yaml
          kubectl wait --for=condition=Available=false apiservice/v1beta1.inv4-unavailable.example.com --timeout=120s
          kubectl get apiservice v1beta1.inv4-unavailable.example.com

      # A host with a home of its own and nothing saved, started after the group was registered: its plugin connects to a cluster that has the group, as the demo's host did.
      - name: Start a host for the cluster with the unavailable API group
        run: scripts/ui-next-pods/host.sh start unavailable-group 34204 "$KUBECONFIG_PATH" "$OMNIVIEW_E2E_WORK/plugin"

      - name: Check that the connection starts with an unavailable API group
        env:
          OMNIVIEW_CHECK_BASE_URL: http://127.0.0.1:34204
          OMNIVIEW_CHECK_KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
          OMNIVIEW_CHECK_MODE: unavailable-group
        run: node --test scripts/ui-next-pods/pods-cluster.check.mjs

      - name: Collect diagnostics
        if: failure()
        run: |
          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl get pods -A -o wide || true
          kubectl get apiservices || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          for name in with-plugin without-plugin without-bundle unavailable-group; do
            echo "::group::host $name log"
            tail -n 120 "$OMNIVIEW_E2E_WORK/$name/host.log" || true
            echo "::endgroup::"
          done

      - name: Stop the hosts
        if: always()
        run: |
          scripts/ui-next-pods/host.sh stop with-plugin
          scripts/ui-next-pods/host.sh stop without-plugin
          scripts/ui-next-pods/host.sh stop without-bundle
          scripts/ui-next-pods/host.sh stop unavailable-group
