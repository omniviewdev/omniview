name: History security proofs

on:
  pull_request:
    branches: [main]
    paths:
      - 'bench/historycipherprobe/**'
      - 'bench/historywindowssecurityprobe/**'
      - 'bench/historylinuxsecurityprobe/**'
      - '.github/workflows/history-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  encrypted-macos:
    name: Encrypted history (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: darwin-arm64
          - runner: macos-15-intel
            arch: darwin-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: bench/historycipherprobe/go.sum
      - name: Exercise isolated official SQLCipher and native Keychain
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go env -json GOVERSION GOOS GOARCH CGO_ENABLED
          bash bench/historycipherprobe/native-darwin.sh | tee "$RUNNER_TEMP/history-cipher-proof.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: history-cipher-${{ matrix.arch }}
          path: ${{ runner.temp }}/history-cipher-proof.txt
          if-no-files-found: error

  windows-vault:
    name: Windows credential and ACL boundaries
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bench/historywindowssecurityprobe
        shell: pwsh
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: bench/historywindowssecurityprobe/go.sum
      - name: Exercise real credential storage and protected ACLs
        run: |
          go env -json GOVERSION GOOS GOARCH CGO_ENABLED
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run . | Tee-Object -FilePath "$env:RUNNER_TEMP/history-windows-proof.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: history-windows-vault
          path: ${{ runner.temp }}/history-windows-proof.json
          if-no-files-found: error

  linux-vault:
    name: Linux Secret Service and filesystem boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: bench/historylinuxsecurityprobe/go.sum
      - name: Install isolated-session proof prerequisites
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring libglib2.0-bin coreutils
      - name: Exercise real Secret Service, denial and private files
        working-directory: bench/historylinuxsecurityprobe
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go env -json GOVERSION GOOS GOARCH CGO_ENABLED
          GOWORK=off go vet ./...
          sh smoke.sh | tee "$RUNNER_TEMP/history-linux-proof.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: history-linux-vault
          path: ${{ runner.temp }}/history-linux-proof.txt
          if-no-files-found: error
