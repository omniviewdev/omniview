name: UI next seam check

# The seam check (ui-next/plugins/e2e/seam.check.mjs, docs/ui-next/slices/n19-plugin-seam.md): the REAL Go host in server mode, built from `OMNIVIEW_UI=next`, loading the fixture plugins that
# ui-next/plugins/fixture/build.mjs builds outside the host's tree, driven by a browser. Plugin loading, the pages, the rail, the bottom panel and the Logs tool, the command palette and its plugin providers,
# the session (reload and a restart of the host), a plugin's unload, the identity of a Logs session, and a plugin's process that is killed and comes back. It is the only check that drives the real host with a
# browser; until this workflow nothing ran it but agents, by hand (docs/ui-next/AGENTS.md, rule 17: "the seam check").
#
# THE JOBS (N29). The seam took 17 to 25 minutes in one job for each engine (setup 3 minutes, the whole seam 10, then every negative control 10) and hit the job's 25-minute limit. It is the same work in as many jobs of each
# engine as it takes to keep each under about 10 minutes: `Seam plan` packs the units of scripts/ci/seam-units.mjs (the phases of the check, and its negative controls, each with the seconds it takes on the runner) into the fewest
# shards of at most 420 s of work (scripts/ci/seam-shards.mjs), and `Seam <engine> shard <n>` runs one shard in one engine, in the CI image pinned by digest (the guard step below, as in the kit probes workflow): install,
# `task packages`, the host the way agents build it for the seam (`OMNIVIEW_UI=next task build:server`, with `GOWORK=off GOTOOLCHAIN=local`), then the shard's phases in that engine (`SEAM_PHASES=<ids>`: one run of the check that does
# only those scenarios, on a host of its own) and the shard's negative controls in that engine. A control runs the scenario it belongs to alone with one perturbation and exits 0 when the assertion it is named for saw it
# (`SEAM_CONTROL=<run>`); the step runs every control of the shard even when one fails. The seam and the controls run in a clean environment: only the engine, the phases or the control are set, nothing of the build's (the check
# starts the host with a minimal environment of its own, and the Go toolchain settings it needs for the fixture plugin's process are its own). NOTHING is selected: every phase and every control runs on every run, in both engines.
#
# THE VERDICT. The job named `Seam check` runs whatever happened (`always()`), with the repository checked out: it requires the plan and every shard to have succeeded, then downloads what each shard wrote about itself
# (`seam-ran-<engine>-<shard>.json`, from the logs of its steps: the phases that printed `SEAM-PHASE`, the controls that said `detected`) and compares it with the table and with the check itself: every phase and every control
# of the check, once, passed, in both engines, in as many shards as the plan made. A shard that failed, timed out (cancelled) or never reported, a shard that ran no scenario, and a phase or control that is in no unit are red. When a
# job is not green it names the scenario that failed and the assertion, from the annotation its failed step wrote.
#
# THE SECONDS ARE HELD (rule 25 of docs/ui-next/AGENTS.md, as the kit probes'): after a shard ran, a unit that took more than its seconds plus the larger of a quarter of them and 60 s fails the shard with the number to put in
# scripts/ci/seam-units.mjs, and so does a shard whose units took more than 546 s. To add a scenario or a control, add it to the check and to a unit (`node scripts/ci/seam-shards.mjs check` fails, naming it, until it is).
#
# Why the shards each build the host (measured, docs/ui-next/status/N29.md): the host build is 105 s of a job of 9 to 10 minutes; one build job and an artifact would save runner time and cost a job in the critical path and an
# upload and a download of the binary and of the packages the fixture plugins are built from. No Go cache: restoring the module and build caches (512 MB) saved 10 s of 95 and the repository's caches are over their limit.
# The seam's own time was 8 s a run too long: every wait for a host to exit left an 8 s timer that held the process open, in each of the 27 runs of the negative controls of each engine (`untilExited` in the check).
#
# NOT a required check yet, for the reason ui-next-pods.yml gives: it is path-filtered, and a required check that does not run on a pull request blocks the merge. The lead makes `Seam check` (the aggregating job,
# whose name does not change) required once it has been green for a while.
#
# PATHS. What the seam reads: the new UI and the kit (`ui-next/**`, `packages/**`: the kit, the runtime's curated entry the fixture imports, the providers and the Vite plugin that `vite.config.ts` and `task packages`
# build), the dependency lock, the flavour switch and the frontend build inputs, and the Go host that `build:server` compiles (`go list -deps -tags production,server .`: the root package, `backend/`, `internal/`, `pkg/`,
# `go.mod`, `go.sum`, the host module bootstrap in `scripts/hostmod/`, the Taskfiles). Markdown is never an input. A pull request that changes only documentation does not start this workflow.

on:
  pull_request:
    paths:
      - "ui-next/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "patches/**"
      - "tsconfig*.json"
      - "*.go"
      - "backend/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "scripts/hostmod/**"
      - "Taskfile.yml"
      - "build/Taskfile.yml"
      - ".github/ci/image.lock"
      - "scripts/ci/seam-*"
      - "scripts/ci/ci-scope*"
      - ".github/workflows/ui-next-seam.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "ui-next/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "patches/**"
      - "tsconfig*.json"
      - "*.go"
      - "backend/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "scripts/hostmod/**"
      - "Taskfile.yml"
      - "build/Taskfile.yml"
      - ".github/ci/image.lock"
      - "scripts/ci/seam-*"
      - "scripts/ci/ci-scope*"
      - ".github/workflows/ui-next-seam.yml"
      - "!**/*.md"
  # The nightly run: everything (N30). A pull request runs the phases in WebKit and no negative control; this and every push to main run every phase and every control in both engines.
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "full (everything: the default) or pr (what a pull request runs: WebKit, no negative controls)"
        type: choice
        options: [full, pr]
        default: full

# A new push to a pull request supersedes the run of the one before it; a run on main is never cancelled (every commit of main is verified).
concurrency:
  group: ui-next-seam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The plan: the table is checked against the check (every phase and every control in exactly one unit, nothing the check lacks) and the units are packed into shards. It writes the matrix the shard jobs read (one entry for each
  # engine and shard) and the number of shards, which `Seam check` compares with what the shards report. It fails when it would plan no shard.
  plan:
    name: Seam plan
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      scope: ${{ steps.plan.outputs.scope }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      # Two commits: the base of the merge commit a pull request is checked out as, and the pull request (scripts/ci/ci-scope.mjs reads the diff between them).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      # The ONE place that says what this run does (scripts/ci/ci-scope.mjs, the same step as the kit probes'): everything on main, every night, on request and for a change to the test infrastructure; a pull request's scope
      # (WebKit, the phases, no negative control) otherwise.
      - name: Decide the scope of this run
        id: scope
        env:
          SCOPE_INPUT: ${{ inputs.scope }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/ci-scope.mjs

      - name: Check the units against the check and pack the shards
        id: plan
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          node scripts/ci/seam-shards.mjs check
          node scripts/ci/seam-shards.mjs plan --scope "$SCOPE" --reason "$REASON"

  seam:
    name: Seam ${{ matrix.engine }} shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    # A shard is planned at 420 s of work (scripts/ci/seam-shards.mjs, LIMIT_SECONDS) plus a setup of about 175 s (container 36, install, packages 25, the host build 105; 260 s on the slowest machine seen), and fails past 546 s
    # of units. Measured in one job: 17 to 25 minutes, which is what this replaces (the limit was 25). 20 is the wall for a shard that hangs: the slowest setup and the ceiling are 13.5 minutes.
    timeout-minutes: 20
    # The CI image holds Node, pnpm, Task, Go, the native libraries of the host (GTK 4 and WebKitGTK, which the Wails bindings need to be generated) and the Playwright browsers of the version pnpm-lock.yaml
    # resolves. It is pinned by DIGEST, the one in .github/ci/image.lock (scripts/ci/check-image.mjs fails when a workflow pins another and when the lock is behind the repository's inputs). The package is private:
    # the job token reads it (`packages: read`), and the image is pulled with the credentials block, as the other container jobs do.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/omniviewdev/omniview-ci@sha256:289353ab91800166914d98c79ab71fa06b2261e7963c72a695dca606e36dd784
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      # Every shard of every engine runs to the end: one push shows what fails in each.
      fail-fast: false
      # The plan's matrix: `{ include: [{ engine, shard, units, phases, controls, seconds }] }`. `phases` is the ids for SEAM_PHASES, `controls` the runs of SEAM_CONTROL, `units` the ids of scripts/ci/seam-units.mjs.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The runner creates this mount as UID 1001; Git must see the same owner as the container user after checkout's temporary HOME goes away.
      - name: Match checkout directory ownership to container user
        run: chown "$(id -u):$(id -g)" "$PWD"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Is the image the one this checkout needs? A stale image fails here, in a second, naming the input that moved, and not as a browser that cannot be found.
      - name: The image is not stale
        run: node scripts/ci/check-image.mjs check --manifest /opt/ci/manifest.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before anything is built: the table against the check, and the tests of the plan, the report and the verdict (one of them holds the text the plan reads from the check to the check's own `SEAM_LIST=1`).
      - name: Check the units and the tests of the plan
        run: |
          node scripts/ci/seam-shards.mjs check
          node --test scripts/ci/seam-*.test.mjs scripts/ci/ci-scope.test.mjs scripts/ci/main-red.test.mjs

      - name: Build the workspace packages (the kit among them)
        run: |
          task packages
          # `task packages` rewrites this tracked shim (docs/ui-next/AGENTS.md, Commands); it is not part of the change under test.
          git checkout -- packages/omniviewdev-vite-plugin/shims/_omniviewdev__runtime__models.mjs

      # The host as agents build it for the seam: the frontend (`vite build` with OMNIVIEW_UI=next into dist/, embedded), the Wails bindings, then bin/Omniview-server.
      - name: Build the host (OMNIVIEW_UI=next task build:server)
        env:
          OMNIVIEW_UI: next
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: task build:server

      # The phases of this shard in this engine. A failure is written as one annotation that names the scenario (the id of the last `// <id>.` marker or doc comment above the line of the failing check function, a letter or a letter and digits
      # as in `h2`, and the function) and the assertion; `Seam check` repeats it. scripts/ci/changes-workflows.test.mjs runs this very program over the check and holds every scenario function to its own marker.
      - name: The seam (${{ matrix.engine }})
        if: ${{ matrix.phases != '' }}
        env:
          ENGINES: ${{ matrix.engine }}
          SEAM_PHASES: ${{ matrix.phases }}
        run: |
          set -o pipefail
          check=ui-next/plugins/e2e/seam.check.mjs
          log="$RUNNER_TEMP/seam-$ENGINES.log"
          if node "$check" 2>&1 | tee "$log"; then
            exit 0
          fi
          # The first frame of a scenario function (checkHealthy, checkRail, ...) and its line: where in the check the failing assertion or wait is.
          frame="$(grep -m1 -oE 'at (async )?check[A-Z][A-Za-z]* \([^)]*seam\.check\.mjs:[0-9]+' "$log" | sed -E 's/^at (async )?//; s/ \(.*seam\.check\.mjs:/ at line /' || true)"
          line="${frame##* }"
          letter=""
          if [[ "$line" =~ ^[0-9]+$ ]]; then
            letter="$(awk -v n="$line" 'NR > n { exit } match($0, /^[ ]*(\/\/|\*|\/\*\*) [a-z][0-9]*\. [A-Za-z]/) { s = $0; sub(/^[ ]*(\/\/|\*|\/\*\*) /, "", s); l = substr(s, 1, index(s, ".") - 1) } END { print l }' "$check")"
          fi
          if [ -n "$frame" ]; then
            scenario="${letter:-?} (${frame})"
          else
            scenario="none: no scenario function in the stack, the host did not start or the fixture build failed"
          fi
          # The assertion: an Error's first line, or (a Playwright timeout has none) the last line before the first stack frame that is not blank or call log, and the first line the call log waited for.
          message="$(grep -m1 -E '^[A-Za-z]*Error' "$log" | head -c 500 || true)"
          if [ -z "$message" ]; then
            message="$(awk '/^    at / { exit } !/^$/ && !/^Call log:/ && !/^  - / { last = $0 } END { print last }' "$log" | head -c 300)"
            waited="$(awk '/^    at / { exit } /^  - / { print; exit }' "$log" | head -c 300)"
            [ -z "$waited" ] || message="$message ${waited# }"
          fi
          message="${message//'%'/'%25'}"
          echo "::error title=Seam $ENGINES::scenario $scenario: $message"
          {
            echo "### Seam $ENGINES failed"
            echo
            echo "Scenario $scenario"
            echo
            echo '```'
            echo "$message"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Every negative control run of this shard, in this engine, one after the other (the plan's `controls`: the runs of scripts/ci/seam-units.mjs). Each runs the scenario it belongs to alone with one perturbation and passes when the
      # assertion it is named for saw it; one that is not detected, or that fails on another assertion, fails the step. All of them run when one fails. The log of each and the seconds of each are kept for the report that follows.
      - name: The seam's negative controls (${{ matrix.engine }})
        if: ${{ matrix.controls != '' }}
        env:
          ENGINES: ${{ matrix.engine }}
          CONTROLS: ${{ matrix.controls }}
        run: |
          echo "controls: $CONTROLS"
          failed=""
          runs="$RUNNER_TEMP/seam-controls-$ENGINES.tsv"
          : > "$runs"
          {
            echo "### Seam negative controls ($ENGINES)"
            echo
            echo "| control | result | seconds |"
            echo "|---|---|--:|"
          } >> "$GITHUB_STEP_SUMMARY"
          for control in $CONTROLS; do
            echo "::group::SEAM_CONTROL=$control ENGINES=$ENGINES"
            log="$RUNNER_TEMP/control-$ENGINES-$control.log"
            start=$SECONDS
            if SEAM_CONTROL="$control" node ui-next/plugins/e2e/seam.check.mjs 2>&1 | tee "$log"; then
              verdict="detected"
            else
              verdict="NOT DETECTED"
              failed="$failed $control"
              echo "::error title=Seam control $control ($ENGINES)::$(grep -m1 -E 'NEGATIVE CONTROL|Error' "$log" | head -c 400 | sed 's/%/%25/g')"
            fi
            echo "::endgroup::"
            seconds=$((SECONDS - start))
            echo "control $control: $verdict ($seconds s)"
            echo "| $control | $verdict | $seconds |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\t%s\t%s\n' "$control" "$verdict" "$seconds" >> "$runs"
          done
          [ -z "$failed" ] || { echo "::error::controls that failed:$failed"; exit 1; }

      # What this shard ran, from the logs of the steps above, and the seconds of each unit against the table (`scripts/ci/seam-shards.mjs`): a unit that took more than its seconds plus the larger of a quarter of them and 60 s,
      # and a shard that took more than its ceiling, fail here with the number to change. It writes seam-ran-<engine>-<shard>.json, which `Seam check` compares with the check. It runs when an earlier step failed too, so that the
      # verdict has a report to read; the failure is the earlier step's. It does NOT run when the job was cancelled (its timeout, a cancelled run): a shard that hung and was killed must not leave a report that says it passed.
      - name: Hold the seconds and write what this shard ran
        if: ${{ !cancelled() }}
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}
          UNITS: ${{ matrix.units }}
        run: node scripts/ci/seam-shards.mjs report --engine "$ENGINE" --shard "$SHARD" --units "$UNITS" --dir "$RUNNER_TEMP"

      - name: Keep what the shard ran
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: seam-ran-${{ matrix.engine }}-${{ matrix.shard }}
          # A re-run of a shard (or of the run) uploads the same name again: replace what the earlier attempt left, or the upload fails and the verdict reads a stale file.
          overwrite: true
          path: ${{ runner.temp }}/seam-ran-*.json
          if-no-files-found: ignore

  # The check that keeps the name `Seam check`. It runs whatever happened (`always()`: a cancelled run leaves a check, not an absence), with the repository checked out. First it requires the plan and every shard of both engines to have
  # succeeded: a plan that failed (no shard could run), a shard that failed, timed out (cancelled) or was skipped fails it, and so does an empty or unknown result. The jobs that did not succeed are named with the scenario and the
  # assertion their failed step annotated (the token reads the annotations with `checks: read`). Then, whatever the shards' own results said, it requires every phase and every control of the check, and every unit of the table, to
  # have run once and passed in each engine, from what the shards wrote: a plan that was short, a shard that never reported, a shard that ran no scenario and a scenario that dropped out of the table are red.
  seam-check:
    name: Seam check
    needs: [plan, seam]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      # The verdict needs the table and the check's own list, nothing else: a sparse checkout of three paths, on the smallest runner, and nothing is built.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            ui-next/plugins/e2e/seam.check.mjs
            .tool-versions

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Require the plan and every shard to have succeeded
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT: ${{ needs.seam.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PLAN_RESULT" = success ] && [ "$RESULT" = success ]; then
            echo "The plan and every seam shard passed, in WebKit and Chromium."
            exit 0
          fi
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error title=Seam check::the plan job finished as '${PLAN_RESULT:-unknown}', not as success: no shard could run (the units disagree with the check, or the plan could not be written): see the job 'Seam plan'"
            exit 1
          fi
          echo "::error title=Seam check::the seam shards finished as '${RESULT:-unknown}', not as success"
          if jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Seam ")) | select(.name != "Seam check" and .name != "Seam plan") | select(.conclusion != "success") | "\(.id)\t\(.name)\t\(.conclusion // .status)\t\(.html_url)"' 2>&1); then
            while IFS=$'\t' read -r id name conclusion url; do
              [ -n "$id" ] || continue
              echo "::error title=Seam check::$name finished as $conclusion: $url"
              if found=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations?per_page=50" \
                  --jq '.[] | select(.annotation_level == "failure") | select(.title | startswith("Seam ")) | "\(.title) - \(.message)"' 2>&1); then
                if [ -n "$found" ]; then
                  while IFS= read -r line; do echo "::error title=Seam check::${line//'%'/'%25'}"; done <<< "$found"
                fi
              else
                echo "::warning title=Seam check::could not read the annotations of $name: $found"
              fi
            done <<< "$jobs"
          else
            echo "::warning title=Seam check::could not list the jobs of this run: $jobs"
          fi
          exit 1

      - name: Require every phase and every control to have run and passed, in both engines
        env:
          PLAN_SHARDS: ${{ needs.plan.outputs.shards }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          REASON: ${{ needs.plan.outputs.reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'seam-ran-*' --dir "$RUNNER_TEMP/reports"
          node scripts/ci/seam-shards.mjs verify --reports "$RUNNER_TEMP/reports" --shards "$PLAN_SHARDS" --scope "$SCOPE" --reason "$REASON"
