name: Whole-App Profile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  GOWORK: "off"
  GOFLAGS: ""

jobs:
  production-profile:
    name: Production profile (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Exercise production resolution, state initialization, and runtime setup
      # with a stale unrelated development claim, plus durable overlap guards.
      # Keep this independent of reviewed UI/plugin source availability.
      - name: Exercise production profile isolation
        run: >-
          go test -tags server ./internal/instance
          -run '^TestProduction(StartsWithUnrelatedMissingCustomProfileOwner|RejectsDurableCustomProfileOverlap|RejectsInvalidCustomProfileEvidence|AllowsDisjointCustomProfileClaims)$/${{ matrix.channel }}$'
          -count=1 -v

  app-profile:
    name: Whole-app profile
    # Playwright 1.50.1 supports Ubuntu 24.04, not ubuntu-latest's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the released SDK and a matching source cohort
        id: cohort
        shell: bash
        run: |
          # The release tag on omniviewdev/plugin-sdk that go.mod requires is the
          # approval of an SDK change; the cohort must select exactly that commit.
          REVIEWED_SDK_REVISION="$(scripts/sdk-release-revision.sh)"
          jq -e 'type == "object" and (keys == ["kubernetes", "plugin-sdk", "ui"]) and all(.[]; type == "string" and test("^([a-f0-9]{40}|[a-f0-9]{64})$"))' e2e/source-cohort.json > /dev/null
          sdk=$(jq -r '."plugin-sdk"' e2e/source-cohort.json)
          ui=$(jq -r '.ui' e2e/source-cohort.json)
          kubernetes=$(jq -r '.kubernetes' e2e/source-cohort.json)
          if [[ "$sdk" != "$REVIEWED_SDK_REVISION" ]]; then
            echo "::error::e2e/source-cohort.json plugin-sdk must be the commit of the plugin-sdk release that go.mod requires ($REVIEWED_SDK_REVISION)."
            exit 1
          fi
          if [[ "$(git ls-tree HEAD -- plugins/kubernetes)" != "160000 commit $kubernetes"$'\tplugins/kubernetes' ]]; then
            echo "::error::The committed Kubernetes cohort must match the host gitlink."
            exit 1
          fi
          {
            echo "ui=$ui"
            echo "kubernetes=$kubernetes"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed UI source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/ui
          ref: ${{ steps.cohort.outputs.ui }}
          path: .app-profile-sources/ui
          persist-credentials: false

      - name: Checkout reviewed Kubernetes source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview-plugin-kubernetes
          ref: ${{ steps.cohort.outputs.kubernetes }}
          path: .app-profile-sources/kubernetes
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: task packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove native pnpm source composition
        env:
          A11_PROTOCOL_PROBE: "1"
          A11_PROTOCOL_REPORT: ${{ runner.temp }}/app-profile-link-protocol.json
        run: go test -tags server ./internal/devworkspace -run '^TestLinkPinnedProtocolProbe$' -count=1

      # Reuse canonical source linking and JS producers, not the obsolete bundled
      # submodule or unpublished runtime versions. The helper retires its private
      # collection only after the full real-plugin profile finishes.
      - name: Profile
        shell: bash
        env:
          UI_SOURCE_REF: ${{ steps.cohort.outputs.ui }}
          KUBERNETES_SOURCE_REF: ${{ steps.cohort.outputs.kubernetes }}
        run: |
          go run -tags server ./bench/app/build-plugin \
            --host "$GITHUB_WORKSPACE" --host-ref "$(git rev-parse HEAD)" \
            --ui "$GITHUB_WORKSPACE/.app-profile-sources/ui" --ui-ref "$UI_SOURCE_REF" \
            --kubernetes "$GITHUB_WORKSPACE/.app-profile-sources/kubernetes" --kubernetes-ref "$KUBERNETES_SOURCE_REF" \
            --link-evidence "$RUNNER_TEMP/app-profile-link-protocol.json" \
            -- --runs 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-profile-results
          path: bench/app/results/
          if-no-files-found: ignore
          retention-days: 30
