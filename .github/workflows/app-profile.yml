name: Whole-App Profile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  app-profile:
    name: Whole-app profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The kubernetes plugin's UI bundle is built from the submodule and loaded by the app.
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: task packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds the kubernetes plugin UI and the profiling bundle, then runs the
      # scenarios. Writes the summary to the job summary.
      - name: Profile
        run: pnpm bench:app --runs 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-profile-results
          path: bench/app/results/
          if-no-files-found: ignore
          retention-days: 30
