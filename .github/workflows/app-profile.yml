name: Whole-App Profile

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  GOWORK: "off"
  GOFLAGS: ""

jobs:
  production-profile:
    name: Production profile (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Exercise production resolution, state initialization, and runtime setup
      # with a stale unrelated development claim, plus durable overlap guards.
      # Keep this independent of UI/plugin source availability.
      - name: Exercise production profile isolation
        run: >-
          go test -mod=readonly -tags server ./internal/instance
          -run '^TestProduction(StartsWithUnrelatedMissingCustomProfileOwner|RejectsDurableCustomProfileOverlap|RejectsInvalidCustomProfileEvidence|AllowsDisjointCustomProfileClaims)$/${{ matrix.channel }}$'
          -count=1 -v

  app-profile:
    name: Whole-app profile
    # Playwright 1.50.1 supports Ubuntu 24.04, not ubuntu-latest's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve latest Kubernetes release
        id: kubernetes-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/omniviewdev/omniview-plugin-kubernetes/releases/latest --jq '.tag_name')"
          test -n "$tag" && test "$tag" != "null"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Kubernetes source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview-plugin-kubernetes
          ref: ${{ steps.kubernetes-release.outputs.tag }}
          path: .app-profile-sources/kubernetes
          fetch-depth: 0
          persist-credentials: false

      - name: Record Kubernetes commit
        id: kubernetes
        run: echo "commit=$(git -C .app-profile-sources/kubernetes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve SDK commit from host module
        id: sdk
        shell: bash
        run: node e2e/scripts/sdk-source.mjs github-output

      - name: Checkout resolved SDK source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/plugin-sdk
          ref: ${{ steps.sdk.outputs.sdk }}
          fetch-depth: 0
          path: .app-profile-sources/sdk
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Select effective host module
        id: host-module
        shell: bash
        env:
          SDK_SOURCE: ${{ github.workspace }}/.app-profile-sources/sdk
        run: |
          module_directory="$(mktemp -d "$RUNNER_TEMP/app-profile-host-module.XXXXXX")"
          chmod 0700 "$module_directory"
          modfile="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD" --sdk-source "$SDK_SOURCE" --output-directory "$module_directory")"
          printf 'modfile=%s\n' "$modfile" >> "$GITHUB_OUTPUT"
      - name: Build workspace packages
        run: task packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove native pnpm source composition
        env:
          A11_PROTOCOL_PROBE: "1"
          A11_PROTOCOL_REPORT: ${{ runner.temp }}/app-profile-link-protocol.json
          HOST_MODFILE: ${{ steps.host-module.outputs.modfile }}
        run: GOWORK=off GOFLAGS= go test -modfile="$HOST_MODFILE" -mod=readonly -tags server ./internal/devworkspace -run '^TestLinkPinnedProtocolProbe$' -count=1

      # Build the selected plugin with the declared SDK and host package outputs.
      # The helper retires its private collection after the profile finishes.
      - name: Profile
        shell: bash
        env:
          SDK_SOURCE: ${{ github.workspace }}/.app-profile-sources/sdk
          HOST_MODFILE: ${{ steps.host-module.outputs.modfile }}
        run: |
          GOWORK=off GOFLAGS= go run -modfile="$HOST_MODFILE" -mod=readonly -tags server ./bench/app/build-plugin \
            --host "$GITHUB_WORKSPACE" --host-ref "$(git rev-parse HEAD)" \
            --sdk "$SDK_SOURCE" --sdk-ref "${{ steps.sdk.outputs.sdk }}" \
            --kubernetes "$GITHUB_WORKSPACE/.app-profile-sources/kubernetes" --kubernetes-ref "${{ steps.kubernetes.outputs.commit }}" \
            --link-evidence "$RUNNER_TEMP/app-profile-link-protocol.json" \
            -- --runs 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-profile-results
          path: bench/app/results/
          if-no-files-found: ignore
          retention-days: 30
