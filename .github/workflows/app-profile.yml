# Whole-app profile and Production profile (stable, nightly). They produce measurements and fail only when the run itself breaks.
#
# THE PATH FILTER. The workflow runs only when a pull request changes something its jobs read: the list under `on.pull_request.paths` is derived from what the jobs build and
# run (the host frontend and its build inputs for `Whole-app profile`; the host Go packages that `go test` and `go run` compile for both jobs; this file). Not listed, on purpose:
# `packages/kit/` and `ui-next/` (the profile builds the stable `ui/` and `bench/app` never imports them; the kit's build is run by UI checks and Kit probes),
# `e2e/` other than `sdk-source.mjs`, `cmd/` and the root `*.go` files (nothing the jobs compile imports them), docs. `paths:` is workflow-wide, so `Production profile` (Go only)
# also runs on a frontend-only change; it costs 0.3 to 0.4 runner-minutes. Giving it its own filter needs its own workflow file or a changed-files gate (step D1).
# A skipped workflow reports NO check at all; nothing requires these checks (there is no branch protection on `main`, and the ruleset "Lockdown Main" has no required status checks),
# so a skip blocks no merge. Add a path here whenever a new input of the profile is introduced. `workflow_dispatch` is unaffected.
#
# THE PIN. KUBERNETES_PLUGIN_REF is a commit of the plugin's `main` branch: 524d1232a499cf868eb028af61912499736a37a5 (2026-11-14), the head of `main` when it was pinned. Before, the checkout followed
# the default branch, so a plugin merge changed the profile of an unrelated pull request: Whole-app profile failed 23 times in 20 days, the last (2026-11-11, #485) on a TypeScript error merged there. To bump it, in a pull request of this repository that changes nothing else:
#   1. take the commit: `git ls-remote https://github.com/omniviewdev/omniview-plugin-kubernetes refs/heads/main`;
#   2. put it in KUBERNETES_PLUGIN_REF; the step "Record Kubernetes commit" fails if the checkout is anything else;
#   3. the job is green.

name: Whole-App Profile

on:
  pull_request:
    # `labeled`: the label `ci:bench` on a pull request starts it (a pull request runs this only when it carries that label, N30: 329 s of a runner on 9 of 20 pull requests; main and the nightly run it).
    types: [opened, synchronize, reopened, labeled]
    paths:
      # Host frontend that `bench/app` builds and profiles (`pnpm bench:app`: bench/app/vite.config.ts loads the root vite.config.ts), and what `pnpm install` and `task packages` read.
      - "ui/**"
      - "index.html"
      - "public/**"
      - "bench/app/**"
      - "bench/vite/**"
      - "packages/omniviewdev-runtime/**"
      - "packages/omniviewdev-providers/**"
      - "packages/omniviewdev-vite-plugin/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "tsconfig*.json"
      - "Taskfile.yml"
      # Host Go that both jobs compile and run: `go test ./internal/instance` and `./internal/devworkspace`, `go run ./bench/app/build-plugin` and `./scripts/hostmod`
      # (their imports are under `backend/` and `internal/`), the module files, and the script that resolves the SDK commit from go.mod.
      - "internal/**"
      - "backend/**"
      - "pkg/**"
      - "scripts/hostmod/**"
      - "go.mod"
      - "go.sum"
      - "e2e/scripts/sdk-source.mjs"
      - ".github/workflows/app-profile.yml"
  push:
    branches: [main]
    # The same inputs as a pull request's (N31): a path that starts the run on a pull request starts it on main.
    paths:
      - "ui/**"
      - "index.html"
      - "public/**"
      - "bench/app/**"
      - "bench/vite/**"
      - "packages/omniviewdev-runtime/**"
      - "packages/omniviewdev-providers/**"
      - "packages/omniviewdev-vite-plugin/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "tsconfig*.json"
      - "Taskfile.yml"
      - "internal/**"
      - "backend/**"
      - "pkg/**"
      - "scripts/hostmod/**"
      - "go.mod"
      - "go.sum"
      - "e2e/scripts/sdk-source.mjs"
      - ".github/workflows/app-profile.yml"
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: app-profile-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes the run of the one before it; a run on main is not cancelled by a newer push (N30; a group still keeps only one pending run).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  GOWORK: "off"
  GOFLAGS: ""
  KUBERNETES_PLUGIN_REF: 524d1232a499cf868eb028af61912499736a37a5

jobs:
  production-profile:
    name: Production profile (${{ matrix.channel }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:bench') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Exercise production resolution, state initialization, and runtime setup
      # with a stale unrelated development claim, plus durable overlap guards.
      # Keep this independent of UI/plugin source availability.
      - name: Exercise production profile isolation
        run: >-
          go test -mod=readonly -tags server ./internal/instance
          -run '^TestProduction(StartsWithUnrelatedMissingCustomProfileOwner|RejectsDurableCustomProfileOverlap|RejectsInvalidCustomProfileEvidence|AllowsDisjointCustomProfileClaims)$/${{ matrix.channel }}$'
          -count=1 -v

  app-profile:
    name: Whole-app profile
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:bench') }}
    # Playwright 1.50.1 supports Ubuntu 24.04, not ubuntu-latest's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout matching Kubernetes source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview-plugin-kubernetes
          path: .app-profile-sources/kubernetes
          ref: ${{ env.KUBERNETES_PLUGIN_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record Kubernetes commit
        id: kubernetes
        run: |
          commit="$(git -C .app-profile-sources/kubernetes rev-parse HEAD)"
          test "$commit" = "$KUBERNETES_PLUGIN_REF"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve SDK commit from host module
        id: sdk
        shell: bash
        run: node e2e/scripts/sdk-source.mjs github-output

      - name: Checkout resolved SDK source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/plugin-sdk
          ref: ${{ steps.sdk.outputs.sdk }}
          fetch-depth: 0
          path: .app-profile-sources/sdk
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Select effective host module
        id: host-module
        shell: bash
        env:
          SDK_SOURCE: ${{ github.workspace }}/.app-profile-sources/sdk
        run: |
          module_directory="$(mktemp -d "$RUNNER_TEMP/app-profile-host-module.XXXXXX")"
          chmod 0700 "$module_directory"
          modfile="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD" --sdk-source "$SDK_SOURCE" --output-directory "$module_directory")"
          printf 'modfile=%s\n' "$modfile" >> "$GITHUB_OUTPUT"
      - name: Build workspace packages
        run: task packages

      - name: Install Playwright Chromium
        run: |
          # A hung browser download once held this step for 29 minutes: bound each attempt, retry once.
          for attempt in 1 2; do
            if timeout --kill-after=15 300 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out after 300 s"
            # The killed attempt can leave its root apt-get running: let the retry wait for the dpkg lock instead of failing on it.
            echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout >/dev/null
          done
          echo "::error::Playwright browser install failed twice"
          exit 1

      - name: Prove native pnpm source composition
        env:
          A11_PROTOCOL_PROBE: "1"
          A11_PROTOCOL_REPORT: ${{ runner.temp }}/app-profile-link-protocol.json
          HOST_MODFILE: ${{ steps.host-module.outputs.modfile }}
        run: GOWORK=off GOFLAGS= go test -modfile="$HOST_MODFILE" -mod=readonly -tags server ./internal/devworkspace -run '^TestLinkPinnedProtocolProbe$' -count=1

      # Build the selected plugin with the declared SDK and host package outputs.
      # The helper retires its private collection after the profile finishes.
      - name: Profile
        shell: bash
        env:
          SDK_SOURCE: ${{ github.workspace }}/.app-profile-sources/sdk
          HOST_MODFILE: ${{ steps.host-module.outputs.modfile }}
        run: |
          GOWORK=off GOFLAGS= go run -modfile="$HOST_MODFILE" -mod=readonly -tags server ./bench/app/build-plugin \
            --host "$GITHUB_WORKSPACE" --host-ref "$(git rev-parse HEAD)" \
            --sdk "$SDK_SOURCE" --sdk-ref "${{ steps.sdk.outputs.sdk }}" \
            --kubernetes "$GITHUB_WORKSPACE/.app-profile-sources/kubernetes" --kubernetes-ref "${{ steps.kubernetes.outputs.commit }}" \
            --link-evidence "$RUNNER_TEMP/app-profile-link-protocol.json" \
            -- --runs 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-profile-results
          path: bench/app/results/
          if-no-files-found: ignore
          retention-days: 30
