name: CI main red

# ONE GitHub issue, labelled `ci-main-red`, for what is red on main (N30, scripts/ci/main-red.mjs). A pull request runs less than main does (the probes and the seam in WebKit, no negative control, scripts/ci/ci-scope.mjs says
# which), so a failure that only main's run or the nightly run can see must not rot unseen: when one of the workflows below ends red on main (a push or the nightly run) the issue is created or updated with the workflow,
# the first failing run and the range of commits since the last green run of that workflow on main (the first bad commit is in it), and when the workflow is green again its row leaves; the issue closes when none is left.
#
# `workflow_run` runs this file as it is on the default branch. A run that is not this repository's main, started by a push or the nightly schedule, is ignored by the job's condition; a skipped one says nothing about main, and a cancelled one is read from its jobs (a shard that hit its timeout).
on:
  workflow_run:
    workflows:
      - UI next kit probes
      - UI next seam check
      - UI next Pods cluster check
      - Render Benchmarks
      - Whole-App Profile
      - Main macOS universal
    types: [completed]

# One update at a time: two workflows ending together must not write the issue over each other. Nothing is cancelled.
concurrency:
  group: ci-main-red
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  issue:
    name: Update the ci-main-red issue
    # Only this repository's main, started by a push or the nightly schedule (not a fork's branch called main, not a manual run that may have asked for the pull request scope, not a pull request's run); a cancelled run is read from its
    # jobs by the script (a shard that hit its timeout makes the run cancelled).
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["push", "schedule"]'), github.event.workflow_run.event) && contains(fromJSON('["success", "failure", "timed_out", "startup_failure", "cancelled"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"

      - name: Create, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: node scripts/ci/main-red.mjs
