name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    outputs:
      c02_corpus_name: ${{ steps.c02-corpus.outputs.corpus_name }}
    steps:
      - uses: actions/checkout@v4

      # awalsh128/cache-apt-pkgs-action@latest restores an empty package set here, so install directly.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: task check:go-build

      - name: Vet
        run: task check:go-vet

      - name: Test
        run: task check:go-test

      - name: Generate fresh C02 error transport corpus
        id: c02-corpus
        run: |
          CORPUS_NAME="c02-error-corpus-${GITHUB_RUN_ATTEMPT}"
          export C02_ERROR_CORPUS="$RUNNER_TEMP/${CORPUS_NAME}.json"
          task check:c02-corpus
          printf 'corpus_name=%s\n' "$CORPUS_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload C02 error transport corpus
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.c02-corpus.outputs.corpus_name }}
          path: ${{ runner.temp }}/${{ steps.c02-corpus.outputs.corpus_name }}.json
          if-no-files-found: error

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Format check
        run: task check:fmt-check

      # Reports only issues the PR introduces; the existing backlog is not fixed yet.
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14
          only-new-issues: true
        env:
          GOWORK: "off"
        continue-on-error: true

  bindings-check:
    name: Bindings freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # awalsh128/cache-apt-pkgs-action@latest restores an empty package set here, so install directly.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Install pinned private Wails CLI
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Check bindings are up to date
        run: task check:bindings-check

      - name: Check native Wails capability contracts
        run: GOWORK=off GOFLAGS= node --test scripts/wails-tool.test.mjs

  ui-checks:
    name: UI checks
    runs-on: ubuntu-latest
    needs: go-checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: task check:ui-install

      - name: Download producer C02 error transport corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.go-checks.outputs.c02_corpus_name }}
          path: ${{ runner.temp }}

      - name: Check actual C02 runtime error transport
        run: task check:c02-runtime
        env:
          C02_ERROR_CORPUS: ${{ runner.temp }}/${{ needs.go-checks.outputs.c02_corpus_name }}.json

      - name: Check Wails Call settlement ownership
        run: node --test scripts/wails-call.test.mjs

      - name: Build
        run: task check:ui-build

      - name: Check React compiler source admission
        run: node --test scripts/react-compiler.test.mjs

      - name: Lint
        run: task check:ui-lint

      - name: Typecheck
        run: task check:ui-typecheck
