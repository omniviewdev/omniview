name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  id-token: write
  packages: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.27.3"
  NODE_VERSION: "26.13.0"
  # Release jobs must not inherit a developer's workspace/module/tooling flags.
  GOWORK: "off"
  GOFLAGS: ""
  GO_MODFILE: ""
  # Publish a compatible plugin-sdk and update go.mod before releasing; no local fallback.
  SDK_SOURCE: ""
  WAILS_MCP: ""
  EXTRA_TAGS: ""
  RELEASE: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      channel: stable
      development: ${{ 'false' }}
      inject-registry-key: true
      artifact-prefix: ''

  check-homebrew:
    needs: build
    uses: ./.github/workflows/homebrew-check.yml
    with:
      artifact: macos-dmg
      cask: omniview


  publish-updates:
    runs-on: [omniview]
    needs: [build, check-homebrew]
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-update-zip
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist
      - name: Publish signed update
        shell: bash
        env:
          UPDATER_SIGNING_KEYS: ${{ secrets.UPDATER_SIGNING_KEYS }}
          UPDATE_SERVICE_PUBLISH_TOKEN: ${{ secrets.UPDATE_SERVICE_PUBLISH_TOKEN }}
          UPDATE_SERVICE_URL: http://omniview-update-service-api.omniview.svc.cluster.local:5000
        run: |
          version="${GITHUB_REF_NAME#v}"
          node build/updater/publish-to-update-service.mjs --channel stable --version "$version" --dir dist \
            --git-sha "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # ─────────────────────────────────────────────────────────────────────────────
  # NPM — publish @omniviewdev/* packages after platform and Homebrew checks
  # ─────────────────────────────────────────────────────────────────────────────
  publish-npm:
    needs: [build, check-homebrew]
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ github.ref_name }}
      dist-tag: latest

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — download all artifacts, checksums, GitHub Release, Homebrew
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build, check-homebrew, publish-npm]
    steps:
      - name: Verify Homebrew publication credentials
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ': "${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is required to publish the CLI-enabled cask}"'

      - name: Checkout publication helpers
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/macos-dmg/*.dmg release/
          cp artifacts/linux-binary/* release/
          cp artifacts/windows-binary/*.exe release/

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum * > checksums_sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE="release/Omniview_${VERSION}_darwin_universal.dmg"
          SHA256=$(sha256sum "$DMG_FILE")
          SHA256=${SHA256%% *}

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/omniviewdev/homebrew-tap.git" tap
          node build/homebrew/update-cask.mjs tap/Casks/omniview.rb "$VERSION" "$SHA256"
          cd tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/omniview.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update omniview to ${VERSION}"
          git push
