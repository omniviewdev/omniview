name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  # Release jobs must not inherit a developer's workspace/module/tooling flags.
  GOWORK: "off"
  GOFLAGS: ""
  GO_MODFILE: ""
  # Publish a compatible plugin-sdk and update go.mod before releasing; no local fallback.
  SDK_SOURCE: ""
  WAILS_MCP: ""
  EXTRA_TAGS: ""
  RELEASE: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # macOS (darwin/universal) — sign, notarize, DMG
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        shell: bash
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=10.15"
          CGO_LDFLAGS: "-mmacosx-version-min=10.15"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          bash build/darwin/build-universal.sh bin/Omniview -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=stable \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ secrets.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}"

      - name: Create macOS .app bundle
        run: |
          task common:generate:icons
          mkdir -p bin/Omniview.app/Contents/MacOS
          mkdir -p bin/Omniview.app/Contents/Resources
          cp build/darwin/icons.icns bin/Omniview.app/Contents/Resources/
          cp bin/Omniview bin/Omniview.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/Omniview.app/Contents/
          version="${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version%%[-+]*}" bin/Omniview.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" bin/Omniview.app/Contents/Info.plist

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Sign and Notarize
        shell: bash
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_DEVELOPER_SIGN_ID }}
          NOTARY_USER: ${{ secrets.CLI_MACOS_NOTARY_USER }}
          NOTARY_PWD: ${{ secrets.CLI_MACOS_NOTARY_PWD }}
          TEAM_ID: ${{ secrets.CLI_MACOS_TEAM_ID }}
        run: |
          codesign --deep --force \
            --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGN_ID" \
            bin/Omniview.app

          ditto -c -k --keepParent --rsrc bin/Omniview.app archive.zip

          xcrun notarytool submit archive.zip \
            --apple-id "$NOTARY_USER" \
            --password "$NOTARY_PWD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple bin/Omniview.app

      - name: Checkout create-dmg
        uses: actions/checkout@v4
        with:
          repository: create-dmg/create-dmg
          path: ./build/create-dmg
          ref: master

      - name: Create DMG
        shell: bash
        working-directory: ./build
        run: |
          ../build/create-dmg/create-dmg \
            --no-internet-enable \
            --volname "Omniview" \
            --text-size 12 \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon-size 80 \
            --icon "Omniview.app" 180 180 \
            --hide-extension "Omniview.app" \
            --app-drop-link 480 180 \
            "../bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg" \
            "../bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux (linux/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # awalsh128/cache-apt-pkgs-action@latest restores an empty package set here, so install directly.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=stable \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ secrets.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview .

      - name: Rename executable
        working-directory: ./bin
        run: mv Omniview "Omniview_${{ steps.version.outputs.version }}_linux_amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/Omniview_${{ steps.version.outputs.version }}_linux_amd64
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows (windows/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        shell: bash
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        shell: bash
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=stable \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ secrets.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview.exe .

      - name: Rename executable
        working-directory: ./bin
        run: Rename-Item -Path "Omniview.exe" -NewName "Omniview_${{ steps.version.outputs.version }}_windows_amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: bin/Omniview_${{ steps.version.outputs.version }}_windows_amd64.exe
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # NPM — publish @omniviewdev/* packages (runs in parallel with desktop builds)
  # ─────────────────────────────────────────────────────────────────────────────
  publish-npm:
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ github.ref_name }}
      dist-tag: latest

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — download all artifacts, checksums, GitHub Release, Homebrew
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/macos-dmg/*.dmg release/
          cp artifacts/linux-binary/* release/
          cp artifacts/windows-binary/*.exe release/

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum * > checksums_sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set, skipping Homebrew update"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE="release/Omniview_${VERSION}_darwin_universal.dmg"
          SHA256=$(sha256sum "$DMG_FILE" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/omniviewdev/homebrew-tap.git" tap
          cd tap

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/omniview.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/omniview.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/omniview.rb
          git commit -m "Update omniview to ${VERSION}"
          git push
