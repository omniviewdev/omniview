name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish npm packages only (for example v0.9.0); desktop still requires a v* tag"
        required: true
        type: string
      kubernetes-commit:
        description: "Optional full Kubernetes commit for npm bootstrap archive proof; empty uses the pinned published archive"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  id-token: write
  packages: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.27"
  NODE_VERSION: "26.13.0"
  # Release jobs must not inherit a developer's workspace/module/tooling flags.
  GOWORK: "off"
  GOFLAGS: ""
  GO_MODFILE: ""
  # Publish a compatible plugin-sdk and update go.mod before releasing; no local fallback.
  SDK_SOURCE: ""
  WAILS_MCP: ""
  EXTRA_TAGS: ""
  RELEASE: "true"

jobs:
  # Always resolve the archive choice. A skipped/failed candidate producer must
  # never fall back to the published-archive path and authorize npm publication.
  prepare-plugin-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive-artifact: ${{ steps.ready.outputs.archive-artifact }}
    steps:
      - name: Select archive proof
        id: selection
        shell: bash
        env:
          KUBERNETES_COMMIT: ${{ inputs.kubernetes-commit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -z "$KUBERNETES_COMMIT" ]]; then
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$EVENT_NAME" == workflow_dispatch ]]
          [[ "$KUBERNETES_COMMIT" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]
          echo "candidate=true" >> "$GITHUB_OUTPUT"
      - name: Checkout candidate host
        if: steps.selection.outputs.candidate == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup candidate Node
        if: steps.selection.outputs.candidate == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup candidate Go
        if: steps.selection.outputs.candidate == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Setup pinned native pnpm
        if: steps.selection.outputs.candidate == 'true'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false
      - name: Resolve published host SDK commit
        if: steps.selection.outputs.candidate == 'true'
        id: sdk
        run: node e2e/scripts/sdk-source.mjs github-output
      - name: Checkout resolved SDK
        if: steps.selection.outputs.candidate == 'true'
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/plugin-sdk
          ref: ${{ steps.sdk.outputs.sdk }}
          path: .candidate-sources/sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact candidate Kubernetes
        if: steps.selection.outputs.candidate == 'true'
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview-plugin-kubernetes
          ref: ${{ inputs.kubernetes-commit }}
          path: .candidate-sources/kubernetes
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare effective candidate host module
        if: steps.selection.outputs.candidate == 'true'
        id: module
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/candidate-host-module.XXXXXX")"
          chmod 0700 "$directory"
          modfile="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD" --sdk-source "$PWD/.candidate-sources/sdk" --output-directory "$directory")"
          printf 'modfile=%s\n' "$modfile" >> "$GITHUB_OUTPUT"
      - name: Execute actual pinned pnpm protocol probe
        if: steps.selection.outputs.candidate == 'true'
        env:
          A11_PROTOCOL_PROBE: "1"
          A11_PROTOCOL_REPORT: ${{ runner.temp }}/candidate-link-protocol.json
          HOST_MODFILE: ${{ steps.module.outputs.modfile }}
        run: |
          GOWORK=off GOFLAGS= go test -modfile="$HOST_MODFILE" -mod=readonly -tags server ./internal/devworkspace -run '^TestLinkPinnedProtocolProbe$' -count=1
          test -s "$A11_PROTOCOL_REPORT"
      - name: Build canonical candidate archive
        if: steps.selection.outputs.candidate == 'true'
        id: archive
        shell: bash
        env:
          HOST_MODFILE: ${{ steps.module.outputs.modfile }}
          HOST_COMMIT: ${{ github.sha }}
          SDK_COMMIT: ${{ steps.sdk.outputs.sdk }}
          KUBERNETES_COMMIT: ${{ inputs.kubernetes-commit }}
          VERSION: ${{ inputs.version }}
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          parent="$(mktemp -d "$RUNNER_TEMP/candidate-output.XXXXXX")"
          chmod 0700 "$parent"
          GOWORK=off GOFLAGS= go run -modfile="$HOST_MODFILE" -mod=readonly -tags server ./bench/app/build-plugin \
            --host "$PWD" --host-ref "$HOST_COMMIT" \
            --sdk "$PWD/.candidate-sources/sdk" --sdk-ref "$SDK_COMMIT" \
            --kubernetes "$PWD/.candidate-sources/kubernetes" --kubernetes-ref "$KUBERNETES_COMMIT" \
            --link-evidence "$RUNNER_TEMP/candidate-link-protocol.json" \
            --archive-output "$parent/archives" --package-version "$VERSION"
          node bench/app/build-plugin/verify-candidate.mjs --directory "$parent/archives" \
            --host-ref "$HOST_COMMIT" --kubernetes-ref "$KUBERNETES_COMMIT" --version "$VERSION"
          printf 'directory=%s\n' "$parent/archives" >> "$GITHUB_OUTPUT"
      - name: Upload same-run candidate proof
        if: steps.selection.outputs.candidate == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-plugin-archive
          path: ${{ steps.archive.outputs.directory }}/
          if-no-files-found: error
          retention-days: 7
      - name: Authorize only completed candidate producer
        if: steps.selection.outputs.candidate == 'true'
        id: ready
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          test -n "$ARTIFACT_ID"
          echo "archive-artifact=npm-candidate-plugin-archive" >> "$GITHUB_OUTPUT"
  plugin-archive-smoke:
    needs: prepare-plugin-archive
    uses: ./.github/workflows/plugin-archive-smoke.yml
    with:
      host-ref: ${{ github.sha }}
      archive-artifact: ${{ needs.prepare-plugin-archive.outputs.archive-artifact }}
      candidate-commit: ${{ inputs.kubernetes-commit || '' }}
      candidate-version: ${{ inputs.kubernetes-commit && inputs.version || '' }}

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS (darwin/universal) — sign, notarize, DMG
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    if: github.event_name == 'push'
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        shell: bash
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=13.0"
          CGO_LDFLAGS: "-mmacosx-version-min=13.0"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          bash build/darwin/build-universal.sh bin/Omniview -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=stable \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ secrets.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}"

      - name: Build universal developer CLI
        shell: bash
        env:
          BUILD_PACKAGE: ./cmd/omniview-dev
          CGO_ENABLED: "0"
        run: |
          bash build/darwin/build-universal.sh bin/omniview-dev -modfile="$GO_MODFILE" -tags server -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }}"

      - name: Create macOS .app bundle
        run: |
          task common:generate:icons
          mkdir -p bin/Omniview.app/Contents/MacOS
          mkdir -p bin/Omniview.app/Contents/Resources
          cp build/darwin/icons.icns bin/Omniview.app/Contents/Resources/
          cp bin/Omniview bin/Omniview.app/Contents/MacOS/
          cp bin/omniview-dev bin/Omniview.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/Omniview.app/Contents/
          version="${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version%%[-+]*}" bin/Omniview.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" bin/Omniview.app/Contents/Info.plist

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Sign and Notarize
        shell: bash
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_DEVELOPER_SIGN_ID }}
          NOTARY_USER: ${{ secrets.CLI_MACOS_NOTARY_USER }}
          NOTARY_PWD: ${{ secrets.CLI_MACOS_NOTARY_PWD }}
          TEAM_ID: ${{ secrets.CLI_MACOS_TEAM_ID }}
        run: |
          codesign --force --options runtime --sign "$APPLE_SIGN_ID" \
            bin/Omniview.app/Contents/MacOS/omniview-dev
          codesign --deep --force \
            --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGN_ID" \
            bin/Omniview.app

          ditto -c -k --keepParent --rsrc bin/Omniview.app archive.zip

          xcrun notarytool submit archive.zip \
            --apple-id "$NOTARY_USER" \
            --password "$NOTARY_PWD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple bin/Omniview.app

      - name: Checkout create-dmg
        uses: actions/checkout@v4
        with:
          repository: create-dmg/create-dmg
          path: ./build/create-dmg
          ref: master

      - name: Create DMG
        shell: bash
        working-directory: ./build
        run: |
          mkdir -p ../bin/dmg-root
          mv ../bin/Omniview.app ../bin/dmg-root/
          ../build/create-dmg/create-dmg \
            --no-internet-enable \
            --volname "Omniview" \
            --text-size 12 \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon-size 80 \
            --icon "Omniview.app" 180 180 \
            --hide-extension "Omniview.app" \
            --app-drop-link 480 180 \
            "../bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg" \
            "../bin/dmg-root"

      - name: Verify signed universal release archive
        run: bash build/darwin/verify-release-package.sh bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: bin/Omniview_${{ steps.version.outputs.version }}_darwin_universal.dmg
          if-no-files-found: error
          retention-days: 1

  check-homebrew:
    needs: build-macos
    uses: ./.github/workflows/homebrew-check.yml
    with:
      artifact: macos-dmg
      cask: omniview

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux (linux/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/omniviewdev/omniview-ci:ubuntu24-v1
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Match checkout directory ownership to container user
        run: chown "$(id -u):$(id -g)" "$PWD"

      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=stable \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ secrets.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview .

      - name: Rename executable
        working-directory: ./bin
        run: mv Omniview "Omniview_${{ steps.version.outputs.version }}_linux_amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/Omniview_${{ steps.version.outputs.version }}_linux_amd64
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows (windows/amd64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stock host module
        shell: bash
        run: |
          set -eu
          HOST_MODFILE="$(GOWORK=off GOFLAGS= go run ./scripts/hostmod/main.go --root "$PWD")"
          printf 'GO_MODFILE=%s\n' "$HOST_MODFILE" >> "$GITHUB_ENV"

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build frontend
        shell: bash
        run: task common:build:frontend RELEASE=true DEV=false BUILD_FLAGS='-tags production'

      - name: Build Omniview
        shell: bash
        run: |
          go build -modfile="$GO_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui \
              -X github.com/omniviewdev/omniview/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=false \
              -X github.com/omniviewdev/omniview/internal/instance.buildChannel=stable \
              -X github.com/omniviewdev/registry.OmniviewPublicKeyHex=${{ secrets.REGISTRY_PUBLIC_KEY_HEX }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildOTLPEndpoint=${{ secrets.TELEMETRY_OTLP_ENDPOINT }} \
              -X github.com/omniviewdev/omniview/internal/telemetry.buildPyroscopeEndpoint=${{ secrets.TELEMETRY_PYROSCOPE_ENDPOINT }}" \
            -o bin/Omniview.exe .

      - name: Rename executable
        working-directory: ./bin
        run: Rename-Item -Path "Omniview.exe" -NewName "Omniview_${{ steps.version.outputs.version }}_windows_amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: bin/Omniview_${{ steps.version.outputs.version }}_windows_amd64.exe
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # NPM — publish @omniviewdev/* packages after published-plugin acceptance
  # ─────────────────────────────────────────────────────────────────────────────
  publish-npm:
    needs: plugin-archive-smoke
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      dist-tag: latest

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — download all artifacts, checksums, GitHub Release, Homebrew
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows, check-homebrew, publish-npm, plugin-archive-smoke]
    steps:
      - name: Verify Homebrew publication credentials
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ': "${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is required to publish the CLI-enabled cask}"'

      - name: Checkout publication helpers
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Normalize version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/macos-dmg/*.dmg release/
          cp artifacts/linux-binary/* release/
          cp artifacts/windows-binary/*.exe release/

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum * > checksums_sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE="release/Omniview_${VERSION}_darwin_universal.dmg"
          SHA256=$(sha256sum "$DMG_FILE")
          SHA256=${SHA256%% *}

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/omniviewdev/homebrew-tap.git" tap
          node build/homebrew/update-cask.mjs tap/Casks/omniview.rb "$VERSION" "$SHA256"
          cd tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/omniview.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
