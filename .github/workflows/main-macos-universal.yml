name: Main macOS universal

# The universal (arm64 + amd64) host build: a compile gate, nothing is uploaded, signed or published (the signed build is desktop-build.yml). There is no macOS build on a pull request (N30): a break that
# only shows on x86_64 or on darwin is seen here, in the nightly run, and `ci-main-red` opens its issue. NOT ON PULL REQUESTS AND NOT ON PUSHES TO MAIN (N34, the owner's order of 2026-11-25).
on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

# A run is never cancelled by a newer one.
concurrency:
  group: main-macos-universal
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.27"
  NODE_VERSION: "26.13.0"

jobs:
  build-universal:
    name: build-universal (darwin/universal)
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GOWORK: "off"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build workspace packages
        shell: bash
        run: task packages

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview (universal)
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          HOST_MODFILE="$(task --silent host:prepare)"
          bash build/darwin/build-universal.sh bin/Omniview -modfile="$HOST_MODFILE" -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=0.0.0-main.${GITHUB_RUN_NUMBER} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true"

      - name: Require both slices
        shell: bash
        run: |
          archs="$(xcrun lipo -archs bin/Omniview)"
          echo "slices: $archs"
          for want in arm64 x86_64; do
            case " $archs " in *" $want "*) ;; *) echo "missing slice $want" >&2; exit 1 ;; esac
          done

      # A red main must be visible without opening the log: the summary names
      # the commit and the PR that brought it in.
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr="$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" --jq '.[0] | "#\(.number) \(.title)"' 2>/dev/null || true)"
          {
            echo "## main is red on macOS universal (arm64 + x86_64)"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Pull request: ${pr:-not found (direct push?)}"
            echo "- Run: ${RUN_URL}"
            echo "- The per-PR build is arm64 only: an x86_64-only break is first seen here."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=main macOS universal build failed::commit ${SHA} (${pr:-no PR found}) ${RUN_URL}"
