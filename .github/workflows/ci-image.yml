name: Linux CI Image

on:
  pull_request:
    branches: [main]
    paths:
      - .github/ci/Dockerfile
      - .github/workflows/ci-image.yml
      - e2e/package.json
  push:
    branches: [main]
    paths:
      - .github/ci/Dockerfile
      - .github/workflows/ci-image.yml
      - e2e/package.json
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/omniviewdev/omniview-ci

jobs:
  build:
    name: Build and smoke Linux image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Playwright pin
        run: |
          version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)
          grep -Fx "ARG PLAYWRIGHT_VERSION=$version" .github/ci/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          load: true
          push: false
          tags: omniview-ci:smoke
          cache-from: type=gha,scope=ci-image-ubuntu24
          cache-to: type=gha,mode=max,scope=ci-image-ubuntu24
      - name: Smoke native libraries and Chromium OS dependencies
        run: |
          docker run --rm --init omniview-ci:smoke bash -euo pipefail -c '
            test "$(id -u)" = 0
            node --version | grep -E "^v24\."
            zstd --version
            pkg-config --exists gtk4 webkitgtk-6.0 wayland-client
            pkg-config --modversion gtk4 webkitgtk-6.0 wayland-client
            playwright install-deps --dry-run chromium
          '

  publish:
    name: Publish trusted Linux image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=ubuntu24-v1
      - name: Publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ci-image-ubuntu24
          cache-to: type=gha,mode=max,scope=ci-image-ubuntu24
      - name: Record image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published $IMAGE:ubuntu24-v1@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
