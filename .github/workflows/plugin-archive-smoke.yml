name: Plugin archive smoke

on:
  workflow_call:
    inputs:
      host-ref:
        description: Host revision containing the archive harness
        type: string
        default: main
      archive-artifact:
        description: Same-run artifact containing plugin archives and checksums_sha256.txt
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omniviewdev/omniview
          ref: ${{ inputs.host-ref }}
      - name: Record selected host source
        run: |
          printf 'Archive smoke host source: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: 'false'
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages in publication order
        run: |
          pnpm --filter @omniviewdev/providers build
          pnpm --filter @omniviewdev/runtime build
          pnpm --filter @omniviewdev/vite-plugin build
      - name: Install pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Download candidate archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.archive-artifact }}
          path: ${{ runner.temp }}/candidate-archives
      - name: Verify candidate archive integrity and extract frontend
        shell: bash
        working-directory: ${{ runner.temp }}/candidate-archives
        run: |
          set -euo pipefail
          sha256sum --check --strict checksums_sha256.txt
          mkdir "$RUNNER_TEMP/kubernetes-archive"
          tar -xzf kubernetes-linux_amd64.tar.gz -C "$RUNNER_TEMP/kubernetes-archive" plugin.yaml assets
      - name: Verify production archive exports and launch
        run: node bench/app/archive-smoke.mjs --directory "$RUNNER_TEMP/kubernetes-archive"
      - name: Verify installed plugin chunk retirement
        run: pnpm exec vitest run ui/features/plugins/adapters/clearPlugin.test.ts
