name: Nightly validation

# NOT ON PULL REQUESTS (N34, the owner's order of 2026-11-25: a pull request runs only what is needed for the IDE to build and its unit tests pass; the rest runs at night and on request, and `ci-main-red`
# opens its issue when a night is red). This file is still called pr.yml because scripts/ci/check-image.mjs moves the digest of the CI image in it. It holds the application suite (e2e), the Linux build,
# the Windows tests of the connection profiles and the release packaging contracts. Every job runs.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

# A run is never cancelled by a newer one.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.27"
  NODE_VERSION: "26.13.0"

jobs:
  windows-connection-profiles:
    name: Windows connection profiles
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test released-SDK connection profiles and private credentials
        run: go test ./backend/pkg/plugin/resource -count=1
        env:
          GOWORK: "off"
          GOFLAGS: ""
      - name: Test plugin archive and startup validation on Windows
        run: go test ./backend/pkg/plugin -run '^(TestCheckTarball|TestValidateHasBinary|TestValidateForStart|TestValidateForPhase)'
        env:
          GOWORK: "off"
          GOFLAGS: ""
      - name: Test native output ownership and handle observations
        run: go test ./internal/devoutputs -count=1
        env:
          GOWORK: "off"
          GOFLAGS: ""
      - name: Test exclusive private directory creation
        run: go test ./internal/devsession -run '^TestCreatePrivateDirectoryAt' -count=1
        env:
          GOWORK: "off"
          GOFLAGS: ""
      - name: Test Windows channel profile deletion
        run: go test . -run '^(TestWindowsDelete|TestUpdateServiceListCurrentCustomRoot)'
        env:
          GOWORK: "off"
          GOFLAGS: ""
      # CI5 (docs/ui-next/status/CI5.md): packages whose behaviour differs on Windows. A test that cannot pass there is skipped in the test with its reason (`WINDOWS DEFECT <id>` for a
      # product defect, a plain reason when the test is Unix-only by nature); the step after them lists every skip with its reason in the job summary, so a skip is never silent.
      - name: Test cached plugin roots, the settings file and plugin settings on Windows
        shell: bash
        run: go test -v -count=1 ./internal/appstate ./internal/settings/store ./backend/pkg/plugin/settings 2>&1 | tee "$RUNNER_TEMP/windows-packages.log"
        env:
          GOWORK: "off"
          GOFLAGS: ""
      - name: Test plugin uninstall, reinstall and update, and the channel mTLS tests, on Windows
        shell: bash
        run: |
          go test -v -count=1 ./backend/pkg/plugin \
            -run 'TestPluginFixture|Uninstall|Reinstall|TestInstallPluginFromPath_ConcurrentStateLookups|TestFailedFirstInstall|TestFailedUpdate|TestSuccessfulUpdate|TestHostChannelSyncInstallsSignedFeatureArchive|TestChannelInstallsAndHostSyncSerialize|TestCreateBackend|TestChannel|TestInstalledNative|TestAProcessThat|TestPinnedSDKLoader' \
            2>&1 | tee "$RUNNER_TEMP/windows-plugin-lifecycle.log"
        env:
          GOWORK: "off"
          GOFLAGS: ""
      - name: List the tests Windows skipped, with their reasons
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Tests skipped on Windows (CI5)"
            echo
            echo "| Test | Reason |"
            echo "|---|---|"
            cat "$RUNNER_TEMP"/windows-packages.log "$RUNNER_TEMP"/windows-plugin-lifecycle.log 2>/dev/null |
              awk '/^=== (RUN|CONT) +/{cur=$3; next} /^ +[A-Za-z0-9_.]+_test\.go:[0-9]+: /{r=$0; sub(/^ +[A-Za-z0-9_.]+_test\.go:[0-9]+: /,"",r); sub(/: rename C:.*/,"",r); if (!(cur in why)) why[cur]=r; next} /^ *--- SKIP: /{n=$3; r=why[n]; if (r=="") r="(no reason logged)"; gsub(/\|/,"\\|",r); print "| " n " | " r " |"}'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Go checks, Go lint, Bindings freshness and the release packaging contracts are ONE job (N31): four jobs each paid a container, a checkout, Go and Task (about 2 minutes of setup apiece) and a slot. The groups run
  # one after the other in the same checkout, and a group that comes after another runs whatever happened before it (`!cancelled()`), so one push shows every failing group, as four jobs did. A cancelled
  # job runs nothing more. The lint reads the patch of the pull request against its base, in a detached worktree of the committed go.mod/go.sum graph (docs/ui-next/status/N24-L2.md).

  # The release packaging contracts (they were steps of Go checks on a pull request): the Homebrew cask publication and the syntax of the macOS packaging scripts.
  release-contracts:
    name: Release packaging contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Homebrew cask publication
        run: node --test build/homebrew/update-cask.test.mjs

      - name: Check macOS packaging shell syntax
        run: |
          bash -n build/darwin/build-universal.sh
          bash -n build/darwin/verify-release-package.sh

  # The caches of a pull request come from main (a cache saved on a pull request is visible to that branch only), and main no longer runs the pull request's jobs on a push (N34): these two jobs, at night, save
  # the Go build cache and the pnpm store under the keys `Go checks`, `Go lint` and the UI jobs restore (go.sum, pnpm-lock.yaml), so that a pull request starts warm. They fail when the install or the build does.
  cache-primer-go:
    name: Go build cache primer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/omniviewdev/omniview-ci:ubuntu24-v1
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      # The runner creates this mount as UID 1001; Git must see the same owner
      # as the container user after checkout's temporary HOME goes away.
      - name: Match checkout directory ownership to container user
        run: chown "$(id -u):$(id -g)" "$PWD"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup native pnpm for recovery integration tests
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Select restored Go cache for Task
        id: go-cache
        run: |
          GO_BUILD_CACHE_DIRECTORY="$(GOWORK=off GOFLAGS= go env GOCACHE)"
          printf 'directory=%s\n' "$GO_BUILD_CACHE_DIRECTORY" >> "$GITHUB_OUTPUT"
          GOWORK=off GOFLAGS= go env -json GOVERSION GOOS GOARCH GOCACHE

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify effective Task Go cache
        run: task check:go-cache GO_BUILD_CACHE_DIRECTORY="${{ steps.go-cache.outputs.directory }}"

      # The same commands as `Go checks` on a pull request, except the tests: what they build and compile is what the cache then holds (go.sum is its key).
      # A pull request runs `go test -short` (the slow tests skip themselves, rule 40 of docs/ui-next/AGENTS.md); this runs EVERY test and none from the result cache (`-count=1`): it is the Go safety net, and this workflow is on the `ci-main-red` list.
      - name: Build
        run: task check:go-build GO_BUILD_CACHE_DIRECTORY="${{ steps.go-cache.outputs.directory }}"

      - name: Vet
        run: task check:go-vet GO_BUILD_CACHE_DIRECTORY="${{ steps.go-cache.outputs.directory }}"

      - name: Test (every test, no -short)
        run: task check:go-test GO_BUILD_CACHE_DIRECTORY="${{ steps.go-cache.outputs.directory }}" -- -count=1

  cache-primer-ui:
    name: pnpm store primer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: task check:ui-install

  # One canonical application execution; the exact required check name stays
  # stable even though reusable workflow checks have a caller/job prefix.
  e2e-application:
    uses: ./.github/workflows/e2e-runner.yml

  e2e-tests:
    name: e2e-tests
    needs: [e2e-application]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      # Green only when the suite succeeded: a suite that failed, was cancelled or was skipped is red. The step keeps its name and its contract with only RESULT given: e2e/scripts/cache-primer.test.mjs reads it by that name
      # and runs it as a shell script.
      - name: Require canonical suite or explicit prose-only success
        env:
          RESULT: ${{ needs.e2e-application.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::e2e-application finished as ${RESULT:-unknown}"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Artifacts: compile gate, one build per OS. Nothing downloads or
  # consumes the built binaries (N24 M1), so nothing is uploaded.
  # There is no macOS build on a pull request (N30): the thin arm64 build here was 435 s on a macOS runner for a break that only a darwin-only file or a cgo setting of that
  # platform causes, and the universal (arm64+amd64) build that contains it runs on every push to main (main-macos-universal.yml) and in desktop-build.yml (nightly, release
  # tags, feature channel). A break that is darwin only is first seen on main, in the run that opens the `ci-main-red` issue, not on the pull request.
  # There is no Windows build on a pull request either (N31): main-windows.yml builds it on every push to main and at night; the Windows tests of a pull request stay in pr-checks.yml.
  # ─────────────────────────────────────────────────────────────────────────────
  build-artifacts:
    name: build-artifacts (linux/amd64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/omniviewdev/omniview-ci:ubuntu24-v1
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      # Container Git must own the mount after checkout's temporary HOME expires.
      - name: Match checkout directory ownership to container user
        shell: bash
        run: chown "$(id -u):$(id -g)" "$PWD"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build workspace packages
        shell: bash
        run: task packages

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          HOST_MODFILE="$(task --silent host:prepare)"
          go build -o bin/Omniview -modfile="$HOST_MODFILE" -tags "production" -trimpath -buildvcs=false \
            -ldflags "-w -s \
              -X github.com/omniviewdev/omniview/internal/version.Version=0.0.0-nightly.${{ github.run_number }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-pr"
