name: PR Validation

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.27"
  NODE_VERSION: "26.13.0"

jobs:
  # What the pull request changes, class by class (scripts/ci/changes.mjs, docs/ui-next/status/N24-D1.md). The outputs are skip flags: a job runs unless its flag is the string "true", so a
  # classifier that wrote nothing skips nothing. The jobs below that need it are skipped when the change cannot reach them (a documentation-only change, or the new UI alone); a path the
  # script does not know skips nothing. The same job is in pr-checks.yml.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      class: ${{ steps.classify.outputs.class }}
      skip_host: ${{ steps.classify.outputs.skip_host }}
      skip_ui: ${{ steps.classify.outputs.skip_ui }}
      skip_windows: ${{ steps.classify.outputs.skip_windows }}
    steps:
      # HEAD^1 is the base of the merge commit a pull request is checked out as: two commits are all the script needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify the changed paths
        id: classify
        run: node scripts/ci/changes.mjs --base HEAD^1

  # One canonical application execution; the exact required check name stays
  # stable even though reusable workflow checks have a caller/job prefix.
  e2e-application:
    needs: changes
    if: ${{ needs.changes.outputs.skip_host != 'true' }}
    uses: ./.github/workflows/e2e-runner.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}

  e2e-tests:
    name: e2e-tests
    needs: [changes, e2e-application]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # Green when the suite succeeded, or when the classifier skipped it (a change that cannot reach the application: documentation, or the new UI alone) and it was skipped. A suite that was
      # meant to be skipped and ran and failed is red; so is a skipped suite when the classifier did not say skip (a code path never reaches the skip), and so is a classifier that did not succeed
      # (a skipped suite then proves nothing). The step keeps its name and its contract with only RESULT given: e2e/scripts/cache-primer.test.mjs reads it by that name and runs it as a shell
      # script, so the verdict is the `run:` block of this step and a step follows it (the test ends the block at the next step).
      - name: Require canonical suite or explicit prose-only success
        env:
          CHANGES: ${{ needs.changes.result }}
          SKIP: ${{ needs.changes.outputs.skip_host }}
          RESULT: ${{ needs.e2e-application.result }}
        run: |
          if [ "$RESULT" = success ]; then
            exit 0
          fi
          if [ "$RESULT" = skipped ] && [ "$CHANGES" = success ] && [ "$SKIP" = true ]; then
            exit 0
          fi
          echo "::error::e2e-application finished as ${RESULT:-unknown} (the changed-path classification: ${CHANGES:-unknown}, skip_host: ${SKIP:-not set})"
          exit 1

      # Only reached when the step above passed (the implicit success()): a suite that was skipped passed it because the classifier said so.
      - name: Say why the suite was skipped
        if: ${{ needs.e2e-application.result == 'skipped' }}
        env:
          CLASS: ${{ needs.changes.outputs.class }}
        run: |
          echo "e2e skipped by path: $CLASS"
          echo "e2e-application: skipped by path: $CLASS" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Artifacts: compile gate, one build per OS. Nothing downloads or
  # consumes the built binaries (N24 M1), so nothing is uploaded.
  # macOS here is a thin arm64 build on macos-15. The universal (arm64+amd64)
  # build runs on every push to main (main-macos-universal.yml) and in
  # desktop-build.yml (nightly, release tags, feature channel): an x86_64-only
  # break is first seen there, not on a PR.
  # Windows is a job of its own (build-artifacts-windows, below) so that a change to the new UI keeps it while the macOS and Linux builds here are skipped (N24 D1).
  # ─────────────────────────────────────────────────────────────────────────────
  build-artifacts:
    name: build-artifacts (${{ matrix.platform }})
    needs: changes
    if: ${{ needs.changes.outputs.skip_host != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/arm64
            build-tags: "production"
            extra-ldflags: ""
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - os: ubuntu-24.04
            container: ghcr.io/omniviewdev/omniview-ci:ubuntu24-v1
            platform: linux/amd64
            build-tags: "production"
            extra-ldflags: ""
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      GOWORK: "off"
      DEVELOPER_DIR: ${{ matrix.developer-dir || '' }}
    steps:
      # Container Git must own the mount after checkout's temporary HOME expires.
      - name: Match checkout directory ownership to container user
        if: runner.os == 'Linux'
        shell: bash
        run: chown "$(id -u):$(id -g)" "$PWD"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build workspace packages
        shell: bash
        run: task packages

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '13.0' || '' }}
        run: |
          HOST_MODFILE="$(task --silent host:prepare)"
          go build -o bin/Omniview -modfile="$HOST_MODFILE" -tags "${{ matrix.build-tags }}" -trimpath -buildvcs=false \
            -ldflags "-w -s ${{ matrix.extra-ldflags }} \
              -X github.com/omniviewdev/omniview/internal/version.Version=0.0.0-pr.${{ github.event.pull_request.number }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-pr"
          if [[ "$RUNNER_OS" == macOS ]]; then
            test "$(xcrun lipo -archs bin/Omniview)" = arm64
          fi

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          task common:generate:icons
          mkdir -p bin/Omniview.app/Contents/MacOS
          mkdir -p bin/Omniview.app/Contents/Resources
          cp build/darwin/icons.icns bin/Omniview.app/Contents/Resources/
          cp bin/Omniview bin/Omniview.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/Omniview.app/Contents/
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.0.0' bin/Omniview.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" bin/Omniview.app/Contents/Info.plist
          codesign --force --deep --sign - bin/Omniview.app

  # The Windows build: the matrix job's steps for Windows (scripts/ci/changes-workflows.test.mjs holds the two together, step by step). It is a job of its own so that a change to the new UI keeps it while the macOS and
  # Linux builds are skipped: `task packages` builds the kit here, the kit has build and generate scripts, and Windows is a shipping platform where path and shell differences bite (docs/ui-next/status/N24-D1.md).
  # Documentation skips it. A step changed in the matrix job is changed here too.
  build-artifacts-windows:
    name: build-artifacts (windows/amd64)
    needs: changes
    if: ${{ needs.changes.outputs.skip_windows != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build workspace packages
        shell: bash
        run: task packages

      - name: Check native Windows React compiler admission
        run: node --test scripts/react-compiler.test.mjs

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          HOST_MODFILE="$(task --silent host:prepare)"
          go build -o bin/Omniview -modfile="$HOST_MODFILE" -tags "production" -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui \
              -X github.com/omniviewdev/omniview/internal/version.Version=0.0.0-pr.${{ github.event.pull_request.number }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-pr"
