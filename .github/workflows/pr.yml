name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Tests — one real application build and isolated owned browser profiles.
  # The reviewed companion SDK must first be published to its remote repository.
  e2e-tests:
    # Keep the application/browser execution image explicit and reproducible.
    runs-on: ubuntu-24.04
    # Safety watchdog, not an acceptance timing claim; reports include preparation.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: host
    env:
      GOWORK: "off"
      GOFLAGS: ""
      REVIEWED_SDK_REVISION: ${{ vars.OMNIVIEW_E2E_REVIEWED_SDK_REVISION }}
      UI_SOURCE_REF: ${{ vars.OMNIVIEW_E2E_UI_REF }}
    steps:
      - name: Checkout host implementation
        uses: actions/checkout@v4
        with:
          path: host
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Require independently reviewed published source inputs
        run: |
          if [[ ! "$REVIEWED_SDK_REVISION" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]; then
            echo "::error::Set repository variable OMNIVIEW_E2E_REVIEWED_SDK_REVISION to the independently reviewed full SDK commit, published and reachable in omniviewdev/plugin-sdk. No unpublished/default revision is accepted."
            exit 1
          fi
          if [[ -z "$UI_SOURCE_REF" ]]; then
            echo "::error::Set repository variable OMNIVIEW_E2E_UI_REF to the UI implementation ref to check out; its resolved full commit is registered."
            exit 1
          fi

      - name: Checkout reviewed SDK source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/plugin-sdk
          ref: ${{ vars.OMNIVIEW_E2E_REVIEWED_SDK_REVISION }}
          path: plugin-sdk
          persist-credentials: false

      - name: Checkout UI implementation
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/ui
          ref: ${{ vars.OMNIVIEW_E2E_UI_REF }}
          path: ui
          persist-credentials: false
      - name: Verify SDK checkout matches reviewed pin
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/plugin-sdk" rev-parse HEAD)" = "$REVIEWED_SDK_REVISION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Selector boundary contracts
        run: node --test e2e/scripts/*.test.mjs

      - name: Select conservative application impact
        id: selection
        env:
          SDK_SOURCE: ${{ github.workspace }}/plugin-sdk
          UI_SOURCE: ${{ github.workspace }}/ui
          KUBERNETES_SOURCE: ${{ github.workspace }}/host/plugins/kubernetes
        run: |
          if ! node e2e/scripts/run.mjs --changed --base '${{ github.event.pull_request.base.sha }}' --select; then
            echo "::warning::Selection failed; requiring the full application path rather than skipping."
            echo "kind=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain no application impact
        if: steps.selection.outputs.kind == 'none'
        run: echo "Application E2E preparation skipped only for explicitly allowlisted prose with an unchanged committed source cohort."

      - name: Install Linux dependencies
        if: steps.selection.outputs.kind != 'none' && steps.selection.outputs.requires_application != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config


      - name: Setup pinned pnpm
        if: steps.selection.outputs.kind != 'none'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          package-json-file: host/package.json
          install: false

      - name: Initialize private native-tool cache container
        if: steps.selection.outputs.kind != 'none'
        env:
          OMNIVIEW_E2E_TOOL_CACHE_ROOT: ${{ runner.temp }}/omniview-e2e-native-tool-cache-v1
          SDK_SOURCE: ${{ github.workspace }}/plugin-sdk
          UI_SOURCE: ${{ github.workspace }}/ui
          KUBERNETES_SOURCE: ${{ github.workspace }}/host/plugins/kubernetes
        # Filesystem ownership only: no install, compile or probe happens here.
        # GITHUB_ENV binds setup-go's native go env cache paths and the runner.
        run: node e2e/scripts/run.mjs --init-tool-cache

      - name: Restore standalone native pnpm content store
        if: steps.selection.outputs.kind != 'none'
        uses: actions/cache@v4
        with:
          # Payload only, never HOME, ownership markers or managed receipts.
          path: ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/pnpm-store/12.14.0
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-native-pnpm-12.14.0-v1-${{ hashFiles('host/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-e2e-native-pnpm-12.14.0-v1-

      - name: Setup Go
        if: steps.selection.outputs.kind != 'none' && steps.selection.outputs.requires_application != 'false'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # setup-go v5 discovers both paths using native go env. Include the
          # explicit-cache recipe to separate these payloads from legacy paths.
          cache-dependency-path: |
            host/go.sum
            host/e2e/scripts/tool-cache.mjs

      - name: Install Task
        if: steps.selection.outputs.kind != 'none' && steps.selection.outputs.requires_application != 'false'
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}


      # The SAME command is available locally via task e2e -- --changed --base REF.
      # Installs, the single application build, profile startup and teardown stay
      # inside this measured invocation; tooling-only selections need no Go host.
      - name: Run canonical application suite once
        if: steps.selection.outputs.kind != 'none'
        env:
          SDK_SOURCE: ${{ github.workspace }}/plugin-sdk
          UI_SOURCE: ${{ github.workspace }}/ui
          KUBERNETES_SOURCE: ${{ github.workspace }}/host/plugins/kubernetes
        run: node e2e/scripts/run.mjs ${{ steps.selection.outputs.kind == 'selected' && '--changed' || '--full' }} --base '${{ github.event.pull_request.base.sha }}'

      - name: Upload only allowed browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            host/e2e/playwright-report/
            host/e2e/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Artifacts — downloadable binaries for manual testing
  # ─────────────────────────────────────────────────────────────────────────────
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact-name: pr-build-macos
            build-tags: "production"
            extra-ldflags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            artifact-name: pr-build-linux
            build-tags: "production"
            extra-ldflags: ""
          - os: windows-latest
            platform: windows/amd64
            artifact-name: pr-build-windows
            build-tags: "production"
            extra-ldflags: "-H windowsgui"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # awalsh128/cache-apt-pkgs-action@latest restores an empty package set here, so install directly.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - name: Install dependencies and global TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm add --global typescript

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3
        shell: bash
        run: GOWORK=off GOFLAGS= bash ./scripts/install-wails-cli.sh

      - name: Build workspace packages
        shell: bash
        run: task packages

      - name: Build frontend
        shell: bash
        run: task common:build:frontend

      - name: Build Omniview
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=10.15' || '' }}
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=10.15' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '10.15' || '' }}
        run: |
          build_command=(go build -o bin/Omniview)
          if [[ "$RUNNER_OS" == macOS ]]; then
            build_command=(bash build/darwin/build-universal.sh bin/Omniview)
          fi
          "${build_command[@]}" -tags "${{ matrix.build-tags }}" -trimpath -buildvcs=false \
            -ldflags "-w -s ${{ matrix.extra-ldflags }} \
              -X github.com/omniviewdev/omniview/internal/version.Version=0.0.0-pr.${{ github.event.pull_request.number }} \
              -X github.com/omniviewdev/omniview/internal/version.GitCommit=${{ github.sha }} \
              -X github.com/omniviewdev/omniview/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/omniviewdev/omniview/internal/version.Development=true \
              -X github.com/omniviewdev/omniview/internal/appstate.buildStateDir=~/.omniview-pr"

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          task common:generate:icons
          mkdir -p bin/Omniview.app/Contents/MacOS
          mkdir -p bin/Omniview.app/Contents/Resources
          cp build/darwin/icons.icns bin/Omniview.app/Contents/Resources/
          cp bin/Omniview bin/Omniview.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/Omniview.app/Contents/
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.0.0' bin/Omniview.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" bin/Omniview.app/Contents/Info.plist
          codesign --force --deep --sign - bin/Omniview.app

      - name: Prepare artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd bin
          zip -r Omniview-pr${{ github.event.pull_request.number }}-macos.zip Omniview.app

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        working-directory: bin
        run: mv Omniview "Omniview-pr${{ github.event.pull_request.number }}-linux-amd64"

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: bin
        run: Rename-Item -Path "Omniview" -NewName "Omniview-pr${{ github.event.pull_request.number }}-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            bin/*.zip
            bin/Omniview-pr*
          if-no-files-found: error
          retention-days: 5
