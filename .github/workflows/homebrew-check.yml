name: Homebrew release package checks

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      cask:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Existing signed package workflow run in this repository
        required: true
        type: string
      expected-source-head:
        description: Exact full commit SHA that produced the signed package
        required: true
        type: string
      artifact:
        description: Exact signed package artifact name
        required: true
        type: string
      cask:
        description: Published tap cask to exercise
        required: true
        type: choice
        options:
          - omniview
          - omniview-nightly

permissions:
  contents: read
  actions: read

jobs:
  install-upgrade:
    name: Install and upgrade (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Checkout published tap metadata
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: omniviewdev/homebrew-tap
          path: homebrew-tap
      - name: Validate signed package source run
        if: inputs.source-run-id != ''
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          EXPECTED_SOURCE_HEAD: ${{ inputs.expected-source-head }}
        with:
          script: |
            const runID = process.env.SOURCE_RUN_ID;
            const head = process.env.EXPECTED_SOURCE_HEAD;
            if (!/^[1-9]\d*$/.test(runID) || !/^[0-9a-f]{40}$/.test(head)) {
              throw new Error('Source run ID and full lowercase source SHA are required');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runID,
            });
            if (run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.head_repository?.full_name !== run.repository.full_name ||
                run.head_sha !== head || run.status !== 'completed') {
              throw new Error('Source run must be completed, belong to this repository, and match the expected source head');
            }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: release-package
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source-run-id || github.run_id }}
      - name: Check native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
      - name: Check cask updater
        run: node --test build/homebrew/update-cask.test.mjs
      - name: Verify signed universal release archive
        run: bash build/darwin/verify-release-package.sh release-package/*.dmg
      - name: Exercise fresh install, legacy upgrade, CLI upgrade, and uninstall
        env:
          CASK: ${{ inputs.cask }}
        run: node build/homebrew/check-cask.mjs release-package/*.dmg "homebrew-tap/Casks/$CASK.rb"
