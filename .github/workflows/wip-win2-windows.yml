name: wip win2 windows
on:
  push:
    branches: ['wip/win2-**']
permissions:
  contents: read
env:
  GO_VERSION: "1.27"
  GOWORK: "off"
  GOFLAGS: ""
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fixture selftests
        continue-on-error: true
        run: go test ./backend/pkg/plugin -run 'TestPluginFixture' -count=1 -v -timeout 10m 2>&1
      - name: pluginmeta
        continue-on-error: true
        run: go test -v -count=1 ./internal/pluginmeta 2>&1
      - name: plugin selection (the job's)
        continue-on-error: true
        run: go test -v -count=1 ./backend/pkg/plugin -run 'TestPluginFixture|Uninstall|Reinstall|TestInstallPluginFromPath_ConcurrentStateLookups|TestFailedFirstInstall|TestFailedUpdate|TestSuccessfulUpdate|TestHostChannelSyncInstallsSignedFeatureArchive|TestChannelInstallsAndHostSyncSerialize|TestCreateBackend|TestChannel|TestInstalledNative|TestAProcessThat' -timeout 15m 2>&1
      - name: whole plugin package (information)
        continue-on-error: true
        run: go test -v -count=1 ./backend/pkg/plugin -timeout 25m 2>&1
