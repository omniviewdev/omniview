name: Main native cache primer

on:
  push:
    branches: [main]

permissions:
  contents: read

# Separate from PR validation; do not interrupt canonical retirement when a new
# merge arrives. Only trusted main pushes can populate the shared main scope.
concurrency:
  group: main-native-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cache:
    uses: ./.github/workflows/e2e-runner.yml
    with:
      cache-only: true
