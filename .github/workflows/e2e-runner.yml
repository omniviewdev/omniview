name: Canonical E2E runner

on:
  workflow_call:
    inputs:
      cache-only:
        description: Prepare native payloads on trusted main pushes, without application assertions
        type: boolean
        default: false
      base:
        description: PR base commit for conservative application selection
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  application:
    if: ${{ !inputs.cache-only || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/omniviewdev/omniview-ci:ubuntu24-v1
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Safety watchdog only; both runner modes keep the inclusive 1800-second clock.
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: host
    env:
      GOWORK: "off"
      GOFLAGS: ""
      GO_VERSION: "1.26"
      NODE_OPTIONS: "--max-old-space-size=4096"
      REVIEWED_SDK_REVISION: ${{ vars.OMNIVIEW_RESOURCE_V2_REVIEWED_SDK_REVISION }}
      CACHE_ONLY: ${{ inputs.cache-only && 'true' || 'false' }}
      OMNIVIEW_E2E_PREINSTALLED_LINUX: "true"
      SELECTION_BASE: ${{ inputs.base }}
    steps:
      - name: Checkout host implementation
        uses: actions/checkout@v4
        with:
          path: host
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"

      - name: Admit independently reviewed candidate cohort
        id: candidate
        run: node e2e/scripts/candidate-source.mjs resolve

      - name: Checkout reviewed SDK source
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/plugin-sdk
          ref: ${{ steps.candidate.outputs.sdk }}
          path: plugin-sdk
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout UI implementation
        uses: actions/checkout@v4
        with:
          repository: omniviewdev/ui
          ref: ${{ steps.candidate.outputs.ui }}
          path: ui
          persist-credentials: false

      - name: Verify exact candidate checkouts
        env:
          SDK_SOURCE: ${{ github.workspace }}/plugin-sdk
          UI_SOURCE: ${{ github.workspace }}/ui
          KUBERNETES_SOURCE: ${{ github.workspace }}/host/plugins/kubernetes
        run: node e2e/scripts/candidate-source.mjs verify

      - name: Resolve container source and native payload paths
        # Shell paths use the container mounts, unlike host-side workflow contexts.
        # Resolve paths only: an exact cache-only hit must not initialize ownership.
        run: |
          {
            echo "SDK_SOURCE=$GITHUB_WORKSPACE/plugin-sdk"
            echo "UI_SOURCE=$GITHUB_WORKSPACE/ui"
            echo "KUBERNETES_SOURCE=$GITHUB_WORKSPACE/host/plugins/kubernetes"
            echo "OMNIVIEW_E2E_TOOL_CACHE_ROOT=$(realpath -e "$RUNNER_TEMP")/omniview-e2e-native-private-v1/omniview-e2e-native-tool-cache-v1"
          } >> "$GITHUB_ENV"

      - name: Start inclusive preparation clock
        run: echo "OMNIVIEW_E2E_PREPARATION_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"


      - name: Selector and cache-mode boundary contracts
        run: node --test e2e/scripts/*.test.mjs

      - name: Select conservative application impact
        id: selection
        run: |
          if [[ "$CACHE_ONLY" == true ]]; then
            echo "kind=cache-only" >> "$GITHUB_OUTPUT"
            echo "requires_application=true" >> "$GITHUB_OUTPUT"
          elif ! node e2e/scripts/run.mjs --changed --base "$SELECTION_BASE" --select; then
            echo "::warning::Selection failed; requiring the full application path rather than skipping."
            echo "kind=full" >> "$GITHUB_OUTPUT"
            echo "requires_application=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain no application impact
        if: steps.selection.outputs.kind == 'none'
        run: echo "Application E2E preparation skipped only for explicitly allowlisted prose with an unchanged committed source cohort."

      - name: Setup Go
        id: go
        if: steps.selection.outputs.kind != 'none' && steps.selection.outputs.requires_application != 'false'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Select exact native payload keys
        id: cache-keys
        if: steps.selection.outputs.kind != 'none'
        env:
          PNPM_KEY: ${{ runner.os }}-${{ runner.arch }}-e2e-native-pnpm-12.14.0-v1-${{ hashFiles('host/pnpm-lock.yaml', 'ui/pnpm-lock.yaml', 'host/plugins/kubernetes/ui/pnpm-lock.yaml') }}
          GO_KEY: setup-go-Linux-x64-ubuntu24-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('host/go.sum', 'plugin-sdk/go.sum', 'host/plugins/kubernetes/go.sum', 'host/e2e/source-cohort.json', 'host/e2e/fixtures/workspace-probe/go.sum', 'host/e2e/scripts/tool-cache.mjs') }}
          BROWSER_KEY: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-e2e-chromium-v1-${{ hashFiles('host/pnpm-lock.yaml', 'host/e2e/package.json') }}
        run: |
          echo "pnpm=$PNPM_KEY" >> "$GITHUB_OUTPUT"
          echo "go=$GO_KEY" >> "$GITHUB_OUTPUT"
          echo "browser=$BROWSER_KEY" >> "$GITHUB_OUTPUT"

      # Lookup-only never restores ownership metadata or creates a native cache
      # container. All three exact main-scope keys must exist to omit preparation.
      - name: Look up exact main pnpm payload
        id: pnpm-lookup
        if: inputs.cache-only
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/pnpm-store/12.14.0
          key: ${{ steps.cache-keys.outputs.pnpm }}
          lookup-only: true

      - name: Look up exact main Go payloads
        id: go-lookup
        if: inputs.cache-only
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/go-mod
            ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/bootstrap-go-build
          key: ${{ steps.cache-keys.outputs.go }}
          lookup-only: true

      - name: Look up exact main Chromium payload
        id: browser-lookup
        if: inputs.cache-only
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/playwright-browsers
          key: ${{ steps.cache-keys.outputs.browser }}
          lookup-only: true

      - name: Decide native preparation
        id: preparation
        env:
          SELECTION: ${{ steps.selection.outputs.kind }}
          GO_HIT: ${{ steps.go-lookup.outputs.cache-hit }}
          PNPM_HIT: ${{ steps.pnpm-lookup.outputs.cache-hit }}
          BROWSER_HIT: ${{ steps.browser-lookup.outputs.cache-hit }}
        run: |
          if [[ "$SELECTION" == none || ( "$CACHE_ONLY" == true && "$GO_HIT" == true && "$PNPM_HIT" == true && "$BROWSER_HIT" == true ) ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain exact native payload hit
        if: inputs.cache-only && steps.preparation.outputs.required == 'false'
        run: echo "All three exact main-scope native payloads already exist; no install, compile, browser tests or application acceptance was performed."

      - name: Setup pinned pnpm
        if: steps.preparation.outputs.required == 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          package-json-file: host/package.json
          install: false

      - name: Initialize private native-tool cache container
        if: steps.preparation.outputs.required == 'true'
        # The mounted runner temp directory belongs to the host runner, not root.
        # Create a fresh private parent as the container user; never adopt, chown
        # or chmod existing runner directories. Keep this path stable across jobs
        # so lookup, restore and save share the same Actions cache version.
        # Restore payloads only, never the cache owner.
        run: |
          mkdir -m 700 -- "$(dirname "$OMNIVIEW_E2E_TOOL_CACHE_ROOT")"
          node e2e/scripts/run.mjs --init-tool-cache

      - name: Restore standalone native pnpm content store
        id: pnpm-cache
        if: steps.preparation.outputs.required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/pnpm-store/12.14.0
          key: ${{ steps.cache-keys.outputs.pnpm }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-e2e-native-pnpm-12.14.0-v1-

      - name: Restore native Go module and compiler payloads
        id: go-cache
        if: steps.preparation.outputs.required == 'true' && steps.selection.outputs.requires_application != 'false'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.GOMODCACHE }}
            ${{ env.GOCACHE }}
          key: ${{ steps.cache-keys.outputs.go }}
          restore-keys: |
            setup-go-Linux-x64-ubuntu24-go-${{ steps.go.outputs.go-version }}-

      - name: Restore exact pinned Chromium payload
        id: browser-cache
        if: steps.preparation.outputs.required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.cache-keys.outputs.browser }}

      - name: Install Task
        if: steps.preparation.outputs.required == 'true' && steps.selection.outputs.requires_application != 'false'
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Same canonical preparation for both modes, exactly one invocation.
      # Cache-only returns through source proof and canonical/private retirement,
      # never through application profiles, Playwright tests or acceptance assertions.
      - name: Run canonical preparation or application suite once
        id: canonical
        if: steps.preparation.outputs.required == 'true'
        env:
          SELECTION: ${{ steps.selection.outputs.kind }}
        run: |
          if [[ "$CACHE_ONLY" == true ]]; then
            node e2e/scripts/run.mjs --cache-only
          elif [[ "$SELECTION" == selected ]]; then
            node e2e/scripts/run.mjs --changed --base "$SELECTION_BASE"
          else
            node e2e/scripts/run.mjs --full --base "$SELECTION_BASE"
          fi

      - name: Save pinned Chromium payload independently of application assertions
        if: ${{ !cancelled() && steps.canonical.outputs.browser_prepared == 'true' && steps.browser-cache.outputs.cache-hit != 'true' && (!inputs.cache-only || steps.canonical.outcome == 'success') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Save native pnpm payload independently of application assertions
        if: ${{ !cancelled() && steps.pnpm-cache.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' && (!inputs.cache-only || steps.canonical.outcome == 'success') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OMNIVIEW_E2E_TOOL_CACHE_ROOT }}/pnpm-store/12.14.0
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Save native Go payloads independently of application assertions
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' && (!inputs.cache-only || steps.canonical.outcome == 'success') }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GOMODCACHE }}
            ${{ env.GOCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Require completed canonical operation or proven skip
        if: ${{ !cancelled() }}
        env:
          SELECTION: ${{ steps.selection.outputs.kind }}
          SELECTION_OUTCOME: ${{ steps.selection.outcome }}
          PREPARATION: ${{ steps.preparation.outputs.required }}
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          GO_HIT: ${{ steps.go-lookup.outputs.cache-hit }}
          PNPM_HIT: ${{ steps.pnpm-lookup.outputs.cache-hit }}
          BROWSER_HIT: ${{ steps.browser-lookup.outputs.cache-hit }}
        run: |
          if [[ "$SELECTION_OUTCOME" == success && "$SELECTION" == none && "$CACHE_ONLY" == false ]]; then
            exit 0
          fi
          if [[ "$CACHE_ONLY" == true && "$PREPARATION" == false && "$GO_HIT" == true && "$PNPM_HIT" == true && "$BROWSER_HIT" == true ]]; then
            exit 0
          fi
          test "$PREPARATION" = true && test "$CANONICAL_OUTCOME" = success

      - name: Check HTML report availability
        id: report-availability
        if: always() && !inputs.cache-only
        working-directory: /
        run: |
          if [[ -f "$GITHUB_WORKSPACE/host/e2e/playwright-report/index.html" ]]; then
            echo "html=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright HTML report
        id: html-report
        if: always() && !inputs.cache-only && steps.report-availability.outputs.html == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: host/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright raw test evidence
        id: test-evidence
        if: always() && !inputs.cache-only
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: host/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize canonical application feedback
        if: always() && !inputs.cache-only
        working-directory: /
        env:
          JOB_STATUS: ${{ job.status }}
          SELECTION: ${{ steps.selection.outputs.kind }}
          SELECTION_OUTCOME: ${{ steps.selection.outcome }}
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          REPORT_URL: ${{ steps.html-report.outputs.artifact-url }}
          EVIDENCE_URL: ${{ steps.test-evidence.outputs.artifact-url }}
          REPORT_UPLOAD_OUTCOME: ${{ steps.html-report.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.test-evidence.outcome }}
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo '## Canonical application E2E'
            echo
            if [[ "$JOB_STATUS" == cancelled || "$CANONICAL_OUTCOME" == cancelled ]]; then
              echo '**Interrupted/cancelled.** Any report or evidence may be partial; no completed acceptance is claimed.'
            elif [[ "$SELECTION_OUTCOME" == success && "$SELECTION" == none ]]; then
              echo '**Skipped: proven no application impact.** The conservative selector allowed only prose with an unchanged source cohort.'
            elif [[ "$CANONICAL_OUTCOME" == success ]]; then
              echo '**Canonical operation succeeded.** This includes runner acceptance and cleanup, not merely browser assertions.'
            elif [[ "$CANONICAL_OUTCOME" == failure ]]; then
              if [[ -f host/e2e/playwright-report/index.html ]]; then
                echo '**Canonical operation failed.** Inspect browser results and canonical logs; preparation, acceptance or cleanup can fail independently.'
              else
                echo '**Canonical operation failed without an HTML report.** Preparation or the runner may have failed before reporter completion; inspect canonical logs.'
              fi
            else
              echo '**Preparation failed or application invocation was not reached.** No application acceptance is claimed; inspect preceding failed steps.'
            fi
            echo
            if [[ -f host/e2e/playwright-report/index.html ]]; then
              echo 'HTML report exists; its contents do not override the canonical status above.'
            else
              echo 'HTML report unavailable: the suite was skipped, preparation failed, or execution ended before the reporter finalized.'
            fi
            echo
            if [[ -n "$REPORT_URL" ]]; then
              printf -- '- [Download HTML report](%s) (`playwright-report`, retained 7 days).\n' "$REPORT_URL"
            else
              printf -- '- HTML artifact unavailable (upload step: `%s`).\n' "$REPORT_UPLOAD_OUTCOME"
            fi
            if [[ -n "$EVIDENCE_URL" ]]; then
              printf -- '- [Download raw test evidence](%s) (`playwright-test-results`, retained 7 days).\n' "$EVIDENCE_URL"
            else
              printf -- '- Raw evidence artifact unavailable (upload step: `%s`); passing or unstarted tests may produce none.\n' "$EVIDENCE_UPLOAD_OUTCOME"
            fi
            echo
            echo 'Artifacts are downloads, not hosted HTML. Extract the entire HTML ZIP, including its data directory, into ./playwright-report.'
            echo 'From this checkout, serve it with the pinned Playwright version:'
            echo '```sh'
            echo 'pnpm --dir e2e exec playwright show-report ../playwright-report'
            echo '```'
            echo 'Open a failed test to inspect retained screenshots, video and redacted browser errors. Raw evidence is a separate optional download.'
            echo 'Traces remain disabled: authenticated Vite HMR URLs can contain tokens. Private profiles, source receipts and temporary logs are not uploaded.'
            echo 'GitHub failure annotations appear in the check/logs when Playwright runs. Hard runner termination may prevent uploads and this summary.'
          } >> "$GITHUB_STEP_SUMMARY"
