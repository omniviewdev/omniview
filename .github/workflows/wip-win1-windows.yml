name: wip win1 windows
on:
  push:
    branches: ['wip/win1-**']
permissions:
  contents: read
env:
  GO_VERSION: "1.27"
  GOWORK: "off"
  GOFLAGS: ""
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go version
        run: go version
      - name: B4 tests on main (before any fix)
        continue-on-error: true
        run: go test ./backend/pkg/plugin -run 'TestHostChannelSyncInstallsSignedFeatureArchive|TestChannelInstallsAndHostSyncSerialize' -count=1 -v -timeout 5m 2>&1 | head -150
