packages:
  - "packages/*"
  - "e2e"
linkWorkspacePackages: false
strictPeerDependencies: true
pmOnFail: error
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@omniviewdev/*'
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@opentelemetry/api': 1.9.1
allowBuilds:
  esbuild: true
  protobufjs: true
  unrs-resolver: false
patchedDependencies:
  '@wailsio/runtime@3.0.0-beta.34': patches/@wailsio__runtime@3.0.0-beta.34.patch
  'monaco-editor@0.52.2': patches/monaco-editor@0.52.2.patch
  # Backport vitejs/vite#22852 and preserve dependencies discovered before initialization.
  'vite@7.3.7': patches/vite@7.3.7.patch
