version: '3'

# Ignore parent go.work/GOFLAGS, including ambient tags and module overrides.
# GO_MODFILE is an optional effective host input; prepared output is separate.
env:
  GOWORK: "off"
  GOFLAGS: ""
  EXTRA_TAGS: '{{if ne .RELEASE "true"}}{{.EXTRA_TAGS | default ""}}{{end}}'
  WAILS_MCP: '{{if ne .RELEASE "true"}}{{.WAILS_MCP | default ""}}{{end}}'
  GO_MODFILE: '{{.GO_MODFILE | default ""}}'
  SDK_SOURCE: '{{.SDK_SOURCE | default ""}}'
  GOCACHE: '{{.GO_BUILD_CACHE_DIRECTORY | default (printf "%s/.local/cache/go-build" .ROOT_DIR)}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "Omniview"
  BIN_DIR: "bin"
  GO_MODFILE: '{{.GO_MODFILE | default ""}}'
  HOST_INPUT_MODFILE: '{{.GO_MODFILE | default ""}}'
  SDK_SOURCE: '{{.SDK_SOURCE | default ""}}'
  HOST_MOD_OUTPUT_DIRECTORY: '{{.HOST_MOD_OUTPUT_DIRECTORY | default ""}}'
  BINDINGS_OUTPUT_DIRECTORY: '{{.BINDINGS_OUTPUT_DIRECTORY | default ""}}'
  GO_BUILD_CACHE_DIRECTORY: '{{.GO_BUILD_CACHE_DIRECTORY | default ""}}'
  C02_ERROR_CORPUS: '{{.C02_ERROR_CORPUS | default (env "C02_ERROR_CORPUS")}}'
  # Plain command text, evaluated only by host Go/Wails tasks (not UI/plugin tasks).
  # Reset cross-compilation variables while running this native-free host helper.
  HOST_BOOTSTRAP: 'GOWORK=off GOFLAGS= GOOS={{OS}} GOARCH={{ARCH}} CGO_ENABLED=0 go run {{printf "%s/scripts/hostmod/main.go" .ROOT_DIR | shellQuote}} --root {{.ROOT_DIR | shellQuote}} {{if .HOST_INPUT_MODFILE}}--host-modfile={{.HOST_INPUT_MODFILE | shellQuote}}{{end}} {{if .SDK_SOURCE}}--sdk-source={{.SDK_SOURCE | shellQuote}}{{end}} {{if .HOST_MOD_OUTPUT_DIRECTORY}}--output-directory={{.HOST_MOD_OUTPUT_DIRECTORY | shellQuote}}{{end}}'
  # An explicit measured tool capability is authenticated by the host adapter.
  # Without one, preserve the stock root-pinned go-run developer path verbatim.
  WAILS_CLI: '{{if hasKey . "OMNIVIEW_WAILS_TOOL_CAPABILITY"}}node {{printf "%s/scripts/wails-tool.mjs" .ROOT_DIR | shellQuote}} --root {{.ROOT_DIR | shellQuote}} --capability {{.OMNIVIEW_WAILS_TOOL_CAPABILITY | shellQuote}} --{{else}}GOWORK=off GOFLAGS= GOOS={{OS}} GOARCH={{ARCH}} go run github.com/wailsapp/wails/v3/cmd/wails3@$(GOWORK=off GOFLAGS= go list -modfile={{printf "%s/go.mod" .ROOT_DIR | shellQuote}} -m -f {{print "{{.Version}}" | shellQuote}} github.com/wailsapp/wails/v3){{end}}'
  # CLI bootstrap and execution must not inherit the standalone source-local cache.
  # Resolve explicit or manifest-linked SDK source before compiling the CLI helper.
  CLI_ENVIRONMENT: 'GOWORK=off GOFLAGS= GO111MODULE=on GOCACHE={{if .GO_BUILD_CACHE_DIRECTORY}}{{.GO_BUILD_CACHE_DIRECTORY | shellQuote}}{{else}}{{env "GOCACHE" | shellQuote}}{{end}} GOTMPDIR='
  CLI_BOOTSTRAP: '{{.CLI_ENVIRONMENT}} GOOS={{OS}} GOARCH={{ARCH}} CGO_ENABLED=0 go run {{printf "%s/scripts/devcli/bootstrap" .ROOT_DIR | shellQuote}} --root {{.ROOT_DIR | shellQuote}} {{if .HOST_INPUT_MODFILE}}--host-modfile={{.HOST_INPUT_MODFILE | shellQuote}}{{end}} {{if .SDK_SOURCE}}--sdk-source={{.SDK_SOURCE | shellQuote}}{{end}}'
  GO_FORMAT_SOURCES: >-
    git ls-files --cached --others --exclude-standard --deduplicate -z -- '*.go' |
    xargs -0 -r sh -c 'for file; do
      if [ -f "$file" ]; then printf "%s\0" "$file"; fi
    done' _
  # Raw caller input; derived defaults are selected at each consuming task.
  BUILD_FLAGS: '{{.BUILD_FLAGS | default ""}}'
  DEV: '{{.DEV | default "false"}}'
  SERVER: '{{.SERVER | default "false"}}'
  RELEASE: '{{.RELEASE | default "false"}}'
  WAILS_MCP: '{{.WAILS_MCP | default ""}}'
  EXTRA_TAGS: '{{.EXTRA_TAGS | default ""}}'
  TARGET_OS: '{{.TARGET_OS | default OS}}'
  # Optimization (DEV) is independent of runtime profile and release channel.
  # RELEASE ignores every ambient tooling tag. EXTRA_TAGS accepts commas/spaces.
  BUILD_TAGS: &composeTags >-
    {{- $tags := list -}}
    {{- if or (ne .DEV "true") (eq .RELEASE "true") -}}{{- $tags = append $tags "production" -}}{{- end -}}
    {{- if eq .SERVER "true" -}}{{- $tags = append $tags "server" -}}{{- end -}}
    {{- if ne .RELEASE "true" -}}
      {{- if eq .WAILS_MCP "1" -}}{{- $tags = append $tags "mcp" -}}{{- end -}}
      {{- range (splitList "," (regexReplaceAll "[,[:space:]]+" (.EXTRA_TAGS | default "") ",")) -}}
        {{- if . -}}{{- $tags = append $tags . -}}{{- end -}}
      {{- end -}}
    {{- end -}}
    {{- join "," (uniq $tags) -}}
  COMPOSED_BUILD_FLAGS: &composeFlags '{{if eq .RELEASE "true"}}-tags {{if eq .SERVER "true"}}production,server{{else}}production{{end}} {{else}}{{if .BUILD_TAGS}}-tags {{.BUILD_TAGS | shellQuote}} {{end}}{{end}}{{if and (eq .DEV "true") (ne .RELEASE "true")}}-buildvcs=false -gcflags=all="-l"{{else}}-trimpath -buildvcs=false -ldflags="-w -s{{if eq (.TARGET_OS | default OS) "windows"}} -H windowsgui{{end}}"{{end}}'

tasks:
  host:prepare:
    summary: Prepare SDK-aware effective host module files using stock Wails
    cmds:
      - '{{.HOST_BOOTSTRAP}}'

  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"
        vars:
          RELEASE: "true"
          DEV: "false"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: "Start the selected managed workspace and return its ready descriptor (detached)"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: 'workspace up --mode {{if eq .SERVER "true"}}browser{{else}}native{{end}}{{if eq .WAILS_MCP "1"}} --mcp{{end}}'

  ui:update:
    summary: Refresh published UI packages to the newest patch allowed by their manifests
    cmds:
      - pnpm --filter omniview --filter @omniviewdev/runtime update --depth 0 @omniviewdev/base-ui @omniviewdev/ai-ui @omniviewdev/editors


  dev:cli:build:
    summary: Build/cache the workspace CLI and print its actual immutable executable path
    cmds:
      - '{{.CLI_BOOTSTRAP}}'

  # Keep CLI_ARGS in the runner: Task preserves shell quoting without a second
  # task CLI invocation. Capture the immutable executable before running it.
  dev:cli:run:
    internal: true
    cmds:
      - |
        set -e
        DEV_CLI="$({{.CLI_BOOTSTRAP}})"
        {{.CLI_ENVIRONMENT}} "$DEV_CLI" {{.CLI_COMMAND}} {{.CLI_ARGS}}

  workspace:inspect:
    summary: "Inspect selected workspace; arguments after -- are passed to the CLI"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace inspect

  workspace:paths:
    summary: "Print selected workspace paths; arguments after -- are passed to the CLI"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace paths

  workspace:profile:
    summary: "Bind an explicitly selected stopped workspace to a custom state root"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace profile

  workspace:init:
    summary: "Initialize a workspace collection; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace init

  workspace:create:
    summary: "Create a named workspace; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace create

  workspace:up:
    summary: "Start a workspace; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace up

  workspace:down:
    summary: "Stop a workspace; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace down

  workspace:restart:
    summary: "Restart a workspace; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace restart

  workspace:edit:
    summary: "Edit workspace selection; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace edit

  workspace:link:
    summary: "Apply workspace dependency links; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace link

  workspace:unlink:
    summary: "Remove workspace dependency links; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace unlink

  workspace:remove:
    summary: "Remove a stopped workspace; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace remove

  workspace:list:
    summary: "List registered workspaces; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace list

  workspace:resume:
    summary: "Resume workspace source setup; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace resume

  workspace:rollback:
    summary: "Roll back workspace source setup; forward arguments after --"
    cmds:
      - task: dev:cli:run
        vars:
          CLI_COMMAND: workspace rollback

  # Build-only server artifact. Development launches use `task dev SERVER=true`
  # or canonical `workspace up --mode browser` with an explicit workspace.

  build:server:
    vars:
      SERVER: "true"
      BUILD_TAGS: *composeTags
      COMPOSED_BUILD_FLAGS: *composeFlags
      BUILD_FLAGS: '{{if eq .RELEASE "true"}}{{.COMPOSED_BUILD_FLAGS}}{{else}}{{.BUILD_FLAGS | default .COMPOSED_BUILD_FLAGS}}{{end}}'
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - |
        set -e
        HOST_MODFILE="$({{.HOST_BOOTSTRAP}})"
        GOWORK=off GOFLAGS= go build {{.BUILD_FLAGS}} -modfile="$HOST_MODFILE" -o "{{.BIN_DIR}}/{{.APP_NAME}}-server" .

  # ──────────────────────────────────────────────
  # CI / Verification targets
  # ──────────────────────────────────────────────

  check:
    summary: Run all CI checks in sequence
    cmds:
      - task: check:go-build
      - task: check:go-vet
      - task: check:go-test
      - task: check:go-lint
      - task: check:fmt-check
      - task: check:bindings-check
      - task: check:ui-install
      - task: check:ui-build
      - task: check:ui-lint
      - task: check:ui-typecheck

  check:go-cache:
    summary: Verify Task uses the explicitly selected Go compiler cache
    requires:
      vars: [GO_BUILD_CACHE_DIRECTORY]
    preconditions:
      - sh: test -n {{.GO_BUILD_CACHE_DIRECTORY | shellQuote}}
        msg: GO_BUILD_CACHE_DIRECTORY must name the selected Go compiler cache
      - sh: test {{osIsAbs .GO_BUILD_CACHE_DIRECTORY}} = true
        msg: GO_BUILD_CACHE_DIRECTORY must name an absolute Go compiler cache directory
    cmds:
      - |
        set -e
        ACTUAL_GOCACHE="$(GOWORK=off GOFLAGS= go env GOCACHE)"
        printf 'Task GOCACHE=%s\n' "$ACTUAL_GOCACHE"
        test "$ACTUAL_GOCACHE" = {{.GO_BUILD_CACHE_DIRECTORY | shellQuote}}

  check:go-build:
    cmds:
      - |
        set -e
        HOST_MODFILE="$({{.HOST_BOOTSTRAP}})"
        GOWORK=off GOFLAGS= go build -modfile="$HOST_MODFILE" ./...

  check:go-vet:
    cmds:
      - |
        set -e
        HOST_MODFILE="$({{.HOST_BOOTSTRAP}})"
        GOWORK=off GOFLAGS= go vet -modfile="$HOST_MODFILE" ./...

  check:go-test:
    cmds:
      - |
        set -e
        HOST_MODFILE="$({{.HOST_BOOTSTRAP}})"
        GOWORK=off GOFLAGS= go test -modfile="$HOST_MODFILE" ./...

  check:c02-corpus:
    summary: Generate fresh C02 SDK-to-gRPC-to-host errors at C02_ERROR_CORPUS
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [C02_ERROR_CORPUS]
    env:
      C02_ERROR_CORPUS: '{{.C02_ERROR_CORPUS}}'
    preconditions:
      - sh: test -n {{.C02_ERROR_CORPUS | shellQuote}}
        msg: C02_ERROR_CORPUS must name the output corpus file
      - sh: test {{osIsAbs .C02_ERROR_CORPUS}} = true
        msg: C02_ERROR_CORPUS must name an absolute output corpus file
    cmds:
      - |
        set -e
        HOST_MODFILE="$({{.HOST_BOOTSTRAP}})"
        GOWORK=off GOFLAGS= go test -modfile="$HOST_MODFILE" ./backend/pkg/plugin/resource -run '^TestC02ErrorTransportCorpus$' -count=1 -timeout 30s

  check:c02-runtime:
    summary: Decode the generated C02_ERROR_CORPUS with the actual runtime parser
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [C02_ERROR_CORPUS]
    env:
      C02_ERROR_CORPUS: '{{.C02_ERROR_CORPUS}}'
    preconditions:
      - sh: test {{osIsAbs .C02_ERROR_CORPUS}} = true
        msg: C02_ERROR_CORPUS must name an absolute generated corpus file
      - sh: test -f {{.C02_ERROR_CORPUS | shellQuote}} && test -r {{.C02_ERROR_CORPUS | shellQuote}}
        msg: C02_ERROR_CORPUS must name a readable generated corpus file
    cmds:
      - node {{printf "%s/node_modules/vitest/vitest.mjs" .ROOT_DIR | shellQuote}} run --config {{printf "%s/vitest.c02.config.mjs" .ROOT_DIR | shellQuote}} --configLoader native --no-cache

  check:c02-transport:
    summary: Generate and consume the same actual C02 transport corpus
    requires:
      vars: [C02_ERROR_CORPUS]
    cmds:
      - task: check:c02-corpus
        vars:
          C02_ERROR_CORPUS: '{{.C02_ERROR_CORPUS}}'
      - task: check:c02-runtime
        vars:
          C02_ERROR_CORPUS: '{{.C02_ERROR_CORPUS}}'

  check:go-lint:
    cmds:
      - cmd: |
          set -e
          if command -v golangci-lint >/dev/null 2>&1; then
            HOST_BINDING_GOFLAGS="$({{.HOST_BOOTSTRAP}} --format goflags)"
            GOWORK=off GOFLAGS="$HOST_BINDING_GOFLAGS" golangci-lint run
          else
            echo "golangci-lint not installed, skipping"
          fi

  check:fmt:
    aliases: [fmt]
    cmds:
      - set -o pipefail; {{.GO_FORMAT_SOURCES}} | xargs -0 -r goimports -w

  check:fmt-check:
    cmds:
      - cmd: |
          set -e -o pipefail
          if ! command -v goimports >/dev/null 2>&1; then
            echo "goimports not found. Install with: go install golang.org/x/tools/cmd/goimports@latest"
            exit 1
          fi
          UNFORMATTED=$({{.GO_FORMAT_SOURCES}} | xargs -0 -r goimports -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go source files need formatting or import cleanup (run task fmt):"
            echo "$UNFORMATTED"
            exit 1
          fi

  check:bindings:
    aliases: [bindings]
    cmds:
      - task: common:generate:bindings

  check:bindings-check:
    vars:
      BUILD_FLAGS: '{{if eq .RELEASE "true"}}{{.COMPOSED_BUILD_FLAGS}}{{else}}{{.BUILD_FLAGS | default .COMPOSED_BUILD_FLAGS}}{{end}}'
      BINDINGS_OUTPUT_DIRECTORY: '{{.BINDINGS_OUTPUT_DIRECTORY | default "packages/omniviewdev-runtime/src/bindings"}}'
    cmds:
      - cmd: |
          set -e
          BINDINGS_DIR={{.BINDINGS_OUTPUT_DIRECTORY | shellQuote}}
          TMPDIR=$(mktemp -d)
          cleanup() {
            if [ -d "$TMPDIR/bindings-before" ]; then
              rm -rf "$BINDINGS_DIR"
              cp -R "$TMPDIR/bindings-before" "$BINDINGS_DIR"
            fi
            rm -rf "$TMPDIR"
          }
          trap cleanup EXIT
          if [ -d "$BINDINGS_DIR" ]; then
            cp -R "$BINDINGS_DIR" "$TMPDIR/bindings-before"
          fi
          task bindings BINDINGS_OUTPUT_DIRECTORY={{.BINDINGS_OUTPUT_DIRECTORY | shellQuote}} {{if .HOST_INPUT_MODFILE}}GO_MODFILE={{.HOST_INPUT_MODFILE | shellQuote}}{{end}} {{if .HOST_MOD_OUTPUT_DIRECTORY}}HOST_MOD_OUTPUT_DIRECTORY={{.HOST_MOD_OUTPUT_DIRECTORY | shellQuote}}{{end}} {{if .GO_BUILD_CACHE_DIRECTORY}}GO_BUILD_CACHE_DIRECTORY={{.GO_BUILD_CACHE_DIRECTORY | shellQuote}}{{end}} {{if .BUILD_FLAGS}}BUILD_FLAGS={{.BUILD_FLAGS | shellQuote}}{{end}}
          if [ -d "$TMPDIR/bindings-before" ]; then
            if ! diff -r "$BINDINGS_DIR" "$TMPDIR/bindings-before" >/dev/null 2>&1; then
              echo "Wails bindings are stale. Run 'task check:bindings' and commit the result."
              exit 1
            fi
          fi

  check:ui-install:
    cmds:
      - pnpm install --frozen-lockfile

  check:ui-build:
    cmds:
      - task: packages
      - pnpm build

  check:ui-lint:
    cmds:
      - pnpm lint

  check:ui-typecheck:
    cmds:
      - pnpm exec tsc -p tsconfig.app.json --noEmit
      - pnpm exec tsc -p tsconfig.test.json --noEmit

  # ──────────────────────────────────────────────
  # Workspace packages
  # ──────────────────────────────────────────────

  packages:
    summary: Build all workspace packages in dependency order
    cmds:
      - pnpm --filter @omniviewdev/providers run build
      - pnpm --filter @omniviewdev/runtime run build
      - pnpm --filter @omniviewdev/vite-plugin run build

  # ──────────────────────────────────────────────
  # Performance
  # ──────────────────────────────────────────────

  perf:coldstart:
    summary: "Build the production bundle and measure cold start (macOS). Args after --, e.g. task perf:coldstart -- -n 10"
    cmds:
      - scripts/perf/coldstart.sh {{.CLI_ARGS}}

  perf:app:
    summary: "Profile the whole frontend in Chromium with a faked backend (bench/app). Args after --, e.g. task perf:app -- --runs 3 --only pods"
    cmds:
      - node bench/app/run.mjs {{.CLI_ARGS}}

  # ──────────────────────────────────────────────
  # E2E tests
  # ──────────────────────────────────────────────

  e2e:
    summary: "Canonical full application E2E, including bootstrap, probes and both frontend modes; --changed --base REF opts into selection"
    cmds:
      - node e2e/scripts/run.mjs {{.CLI_ARGS}}

  e2e-ui:
    summary: "Canonical application E2E with Playwright UI"
    cmds:
      - node e2e/scripts/run.mjs --ui {{.CLI_ARGS}}

  e2e-report:
    cmds:
      - node e2e/scripts/run.mjs --report
