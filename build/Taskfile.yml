version: '3'

env:
  GOWORK: "off"
  GOFLAGS: ""

tasks:
  install:frontend:deps:
    summary: Install frontend dependencies
    dir: "{{.ROOT_DIR}}"
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.pnpm/lock.yaml
    cmds:
      - GOWORK=off GOFLAGS= pnpm install --frozen-lockfile

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    dir: "{{.ROOT_DIR}}"
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - GOWORK=off GOFLAGS= pnpm run {{.BUILD_COMMAND}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
    vars:
      BUILD_COMMAND: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    dir: "{{.ROOT_DIR}}"
    vars:
      BUILD_FLAGS: '{{if eq .RELEASE "true"}}{{.COMPOSED_BUILD_FLAGS}}{{else}}{{.BUILD_FLAGS | default .COMPOSED_BUILD_FLAGS}}{{end}}'
      BINDINGS_OUTPUT_DIRECTORY: '{{.BINDINGS_OUTPUT_DIRECTORY | default "packages/omniviewdev-runtime/src/bindings"}}'
    cmds:
      - |
        set -e
        HOST_MODFILE="$({{.HOST_BOOTSTRAP}})"
        GOWORK=off GOFLAGS= go mod tidy -modfile="$HOST_MODFILE"
        HOST_BINDING_GOFLAGS="$({{.HOST_BOOTSTRAP}} --host-modfile="$HOST_MODFILE" --format goflags)"
        BINDING_FLAGS={{.BUILD_FLAGS | shellQuote}}
        {{.WAILS_CLI}} generate bindings -d {{.BINDINGS_OUTPUT_DIRECTORY | shellQuote}} -f "$BINDING_FLAGS $HOST_BINDING_GOFLAGS" -clean=true -ts

  generate:icons:
    summary: Generates platform icons from appicon.png
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - '{{.WAILS_CLI}} generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico'

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - '{{.WAILS_CLI}} update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .'
