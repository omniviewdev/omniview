# SEC1 proof fixture (docs/ui-next/status/SEC1.md): the Secrets and ConfigMaps the proof reads. Every value of a Secret here names itself ("SEC1-...") so that a copy of it is found wherever it went.
# Applied with `kubectl apply` (client-side) on purpose: that is what leaves the manifest, stringData in the clear, in the annotation kubectl.kubernetes.io/last-applied-configuration.
apiVersion: v1
kind: Namespace
metadata: {name: sec1}
---
apiVersion: v1
kind: Namespace
metadata: {name: sec1-other}
---
# stringData: the server stores data (base64) and `kubectl apply` keeps the manifest, in the clear, in the annotation.
apiVersion: v1
kind: Secret
metadata: {name: applied-string-data, namespace: sec1, labels: {app: sec1}}
type: Opaque
stringData:
  username: SEC1-user-5a1c9e03
  password: SEC1-password-7f3b21d8
---
# data: the manifest names base64 values; the annotation keeps them.
apiVersion: v1
kind: Secret
metadata: {name: applied-data, namespace: sec1, labels: {app: sec1}}
type: Opaque
data:
  token: U0VDMS10b2tlbi0yYzhlNDFhYg==
  api-key: U0VDMS1hcGkta2V5LTkwZGQ1MWY2
---
# the same name in another namespace
apiVersion: v1
kind: Secret
metadata: {name: applied-string-data, namespace: sec1-other, labels: {app: sec1}}
type: Opaque
stringData:
  password: SEC1-password-other-ns-61d04bb7
---
apiVersion: v1
kind: Secret
metadata: {name: pinned, namespace: sec1, labels: {app: sec1}}
type: Opaque
immutable: true
stringData:
  api-key: SEC1-immutable-value-0e7a55c2
---
# No key at all: DATA 0.
apiVersion: v1
kind: Secret
metadata: {name: empty, namespace: sec1, labels: {app: sec1}}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata: {name: registry-login, namespace: sec1, labels: {app: sec1}}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.invalid":{"username":"SEC1-registry-user-3d9f","password":"SEC1-registry-pass-b4e801"}}}'
---
apiVersion: v1
kind: Secret
metadata: {name: site-tls, namespace: sec1, labels: {app: sec1}}
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----\nSEC1-certificate-body-44ac19e7\n-----END CERTIFICATE-----\n"
  tls.key: "-----BEGIN PRIVATE KEY-----\nSEC1-private-key-body-f1209d36\n-----END PRIVATE KEY-----\n"
---
# The token controller fills in the three keys (ca.crt, namespace, token): a real credential.
apiVersion: v1
kind: Secret
metadata:
  name: sa-token
  namespace: sec1
  labels: {app: sec1}
  annotations: {kubernetes.io/service-account.name: default}
type: kubernetes.io/service-account-token
---
# ConfigMaps: configuration, not secret, and sent whole by every read; they can be large.
apiVersion: v1
kind: ConfigMap
metadata: {name: small, namespace: sec1}
data:
  app.properties: "mode=production\nretries=3\n"
  feature-flags: "a,b,c"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: empty, namespace: sec1}
