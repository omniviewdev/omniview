<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300">
<title>Mock: Settings inputs and Select share the medium form-control tier</title>
<g font-family="system-ui, sans-serif" fill="currentColor">
<text x="20" y="28" font-size="14">MOCK — shared Select, not browser-native select chrome</text>
<text x="24" y="98" font-size="13" font-weight="600">Minimap Scale</text>
<text x="24" y="120" font-size="12" opacity=".65">Scale of the minimap rendering.</text>
<rect x="344" y="76" width="252" height="36" rx="5" fill="none" stroke="currentColor" opacity=".35"/>
<text x="356" y="99" font-size="13">1</text>
<path d="M24 139H596" stroke="currentColor" opacity=".2"/>
<text x="24" y="176" font-size="13" font-weight="600">Minimap Slider</text>
<text x="24" y="198" font-size="12" opacity=".65">When to show the minimap slider.</text>
<rect x="344" y="154" width="252" height="36" rx="5" fill="none" stroke="currentColor" opacity=".35"/>
<text x="356" y="177" font-size="13">Mouseover</text><path d="M574 169L578 173L582 169" fill="none" stroke="currentColor"/>
<text x="24" y="247" font-size="14">36px comfortable / 30px compact. Same height for numeric and select fields.</text>
<text x="24" y="273" font-size="14">UI text scales independently; no global toolbar size increase.</text>
</g></svg>
