<!doctype html>
<html lang="en" data-ov-theme="void">
  <head>
    <title>Omniview</title>
    <script>
      (function () {
        // Host boot identity arrives before this script in embedded and proxied HTML.
        // No identity is NOT production: a plain Vite preview must not read its cache.
        var raw = window.__OMNIVIEW_INSTANCE__;
        var valid = raw && raw.schemaVersion === 1
          && typeof raw.instanceID === 'string' && /^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(raw.instanceID)
          && typeof raw.displayName === 'string' && raw.displayName.trim().length > 0
          && typeof raw.generation === 'string'
          && (raw.kind !== 'development' || raw.generation.trim().length > 0)
          && (raw.kind === 'development' || raw.kind === 'production');
        var identity = valid ? Object.freeze({
          schemaVersion: 1,
          instanceID: raw.instanceID,
          displayName: raw.displayName,
          generation: raw.generation,
          kind: raw.kind,
        }) : null;
        // The single key resolver is shared by first paint and all React consumers.
        window.__OMNIVIEW_BOOTSTRAP__ = Object.freeze({
          identity: identity,
          storageKey: function (key) {
            if (!identity) return null;
            return identity.kind === 'production'
              ? key
              : 'omniview:instance:v1:' + encodeURIComponent(identity.instanceID) + ':' + key;
          },
        });
        document.title = identity
          ? identity.kind === 'development' ? 'Omniview — DEV · ' + identity.displayName : 'Omniview'
          : 'Omniview — Instance unavailable';
        var cacheKey = window.__OMNIVIEW_BOOTSTRAP__.storageKey('ov-theme-bootstrap-v1');
        if (cacheKey === null) return;
        try {
          var themes = {
            'void': true,
            'dark': true,
            'light': true,
            'obsidian': true,
            'carbon': true,
            'solarized-dark': true,
            'solarized-light': true,
            'high-contrast-dark': true,
            'high-contrast-light': true,
          };
          var lightThemes = {
            'light': true,
            'solarized-light': true,
            'high-contrast-light': true,
          };
          var themeId = null;
          try {
            var record = JSON.parse(localStorage.getItem(cacheKey));
            if (
              record !== null
              && typeof record === 'object'
              && record.schemaVersion === 1
              && typeof record.themeId === 'string'
              && themes[record.themeId] === true
            ) themeId = record.themeId;
          } catch (_error) {
            // A malformed cache must not hide a valid legacy paint hint.
          }
          if (themeId === null && identity.kind === 'production') {
            var variant = localStorage.getItem('ov-theme-variant');
            var mode = localStorage.getItem('ov-theme-mode');
            themeId = variant === 'solarized'
              ? 'solarized-dark'
              : variant === 'default'
                ? 'void'
                : themes[mode] === true ? mode : 'void';
          }
          if (themeId === null) themeId = 'void';
          document.documentElement.setAttribute('data-ov-theme', themeId);
          document.documentElement.style.colorScheme = lightThemes[themeId] === true
            ? 'light'
            : 'dark';
        } catch (_error) {
          // Invalid or unavailable cache leaves the safe Void first paint intact.
        }
      })();
    </script>
    <!-- Optional standalone DevTools is inserted here only by explicit Vite configuration. -->
    <!-- omniview-react-devtools -->
    <!--
      Pre-create React DevTools hook with an inject() that stores renderers.
      Without this, @vitejs/plugin-react's injectIntoGlobalHook creates a mock
      hook whose inject() does NOT populate hook.renderers. This breaks HMR for
      plugin modules loaded from separate Vite dev servers, because the plugin's
      RefreshRuntime discovers renderers via hook.renderers.forEach() — which is
      empty with the default mock.

      This MUST be a classic (non-module) script so it runs synchronously before
      the React Fast Refresh preamble (a module script injected by Vite).
      The guard (if hook already exists) ensures this is a no-op when DevTools
      or another tool has already installed a full hook.
    -->
    <script>
      (function () {
        if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__) return;
        var nextID = 0;
        var listeners = {};
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          renderers: new Map(),
          supportsFiber: true,
          supportsFlight: true,
          // Event emitter — required by DevTools initBackend (hook.on / hook.sub)
          _listeners: listeners,
          on: function (evt, fn) {
            if (!listeners[evt]) listeners[evt] = [];
            listeners[evt].push(fn);
          },
          off: function (evt, fn) {
            if (!listeners[evt]) return;
            var i = listeners[evt].indexOf(fn);
            if (i !== -1) listeners[evt].splice(i, 1);
          },
          emit: function (evt, data) {
            if (listeners[evt]) listeners[evt].forEach(function (fn) { fn(data); });
          },
          sub: function (evt, fn) {
            this.on(evt, fn);
            return function () { this.off(evt, fn); }.bind(this);
          },
          // Renderer registration — populates renderers Map (fixes plugin HMR)
          // and emits 'renderer' event (fixes DevTools component tree)
          inject: function (injected) {
            var id = nextID++;
            this.renderers.set(id, injected);
            this.emit('renderer', { id: id, renderer: injected });
            return id;
          },
          onScheduleFiberRoot: function () {},
          onCommitFiberRoot: function () {},
          onCommitFiberUnmount: function () {},
          checkDCE: function () {},
        };
      })();
    </script>
